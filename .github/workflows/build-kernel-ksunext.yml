# WHY THE SWAP NEEDS A NEW HOOKS PATCH (not just a new driver fetch):
# backslashxx v3.3.1 is a KernelSU fork whose driver differs from BakaSU
# in three ways that all matter here (all verified against the live
# backslashxx/KernelSU master, tag v3.3.1-38, 2026-11-07):
#   1. There is NO CONFIG_KSU_MANUAL_HOOK and NO CONFIG_KSU_TRACEPOINT_HOOK
#      in its Kconfig. The manual-hook call sites are guarded by plain
#      CONFIG_KSU. So the BakaSU patch's MANUAL_HOOK guard would compile
#      every hook call OUT (silent no-root kernel). The new patch guards
#      everything with CONFIG_KSU.
#   2. The driver provides exactly four hook entry points as globals:
#      ksu_handle_execveat, ksu_handle_faccessat, ksu_handle_stat (all in
#      kernel/feature/sucompat.c) and ksu_handle_sys_reboot (in
#      kernel/supercall/supercall.c), with the same signatures BakaSU had.
#      It does NOT provide ksu_handle_post_execveat, ksu_handle_vfs_read,
#      or ksu_handle_input_handle_event, so those calls are dropped.
#      (ksu_handle_newfstat_ret / ksu_handle_fstat64_ret DO exist, but
#      they are not needed: backslashxx injects its init rc via its LSM
#      hooks, which are on by default. If the manager app cannot connect
#      after flashing, adding those two calls to fs/stat.c is the first
#      thing to try.)
#   3. The hook functions are global ONLY while CONFIG_KSU_TAMPER_SYSCALL_TABLE
#      and CONFIG_KSU_HACK_ARM64_BRANCH_LINK are both off. Either one on
#      makes them `static __always_inline`, which would fail the link.
#      Both default to off (n) for a built-in CONFIG_KSU=y build, and the
#      hooks step forces them off in the defconfig and fails fast if
#      either is y.
# WHAT THE NEW HOOKS PATCH DOES (109 lines, generated from the pristine
# tree at HEAD and verified to apply cleanly):
#   - fs/exec.c: drop the old ksu_execveat_hook bool and the
#     ksu_handle_execveat_sucompat variant; call ksu_handle_execveat
#     directly under CONFIG_KSU. No post_execveat, no __attribute__((hot)).
#   - drivers/input/input.c: DELETE the input hook block (no such
#     function in backslashxx).
#   - fs/read_write.c: DELETE the vfs_read hook block (no such function).
#   - kernel/reboot.c: ADD the sys_reboot hook (extern + call, CONFIG_KSU).
#   - fs/open.c and fs/stat.c: NOT TOUCHED. The pristine tree already
#     calls ksu_handle_faccessat (open.c) and ksu_handle_stat (stat.c,
#     in vfs_fstatat, which covers newfstatat and fstatat64) under
#     CONFIG_KSU, and those two functions exist in backslashxx.
#   - security/selinux/*: NOT TOUCHED. The BakaSU patch exported
#     sel_mutex / sel_handle_status_ops / write_op / policy_rwlock /
#     selinux_status_page because the old driver needed them. Backslashxx
#     reaches policy_rwlock via kallsyms (weak extern + fallback) and
#     never touches the others, so the exports are unnecessary.
#   - defconfig: the tree already ships CONFIG_KSU=y. The step deletes
#     any stale TRACEPOINT/MANUAL_HOOK lines and forces TAMPER_SYSCALL_TABLE
#     and HACK_ARM64_BRANCH_LINK off, then fails fast if any of the four
#     wrong states is present.
