          +/**
          + * seq_put_decimal_ull_width - A helper routine for putting decimal numbers
          + * 			       padded to a minimum field width.
          + * @m: seq_file identifying the buffer to which data should be written
          + * @delimiter: a string which is printed before the number
          + * @num: the number
          + * @width: a minimum field width
          + *
          + * This routine will put strlen(delimiter) + number into seq_file.
          + */
          +void seq_put_decimal_ull_width(struct seq_file *m, const char *delimiter,
          +				 unsigned long long num, unsigned int width)
          +{
          +	int len, padding;
          +	char tmp[24]; /* enough for 64-bit decimal */
          +
          +	if (m->count + 2 >= m->size) /* we'll write 2 bytes at least */
          +		goto overflow;
          +
          +	len = strlen(delimiter);
          +	if (m->count + len >= m->size)
          +		goto overflow;
          +
          +	memcpy(m->buf + m->count, delimiter, len);
          +	m->count += len;
          +
          +	len = num_to_str(tmp, sizeof(tmp), num);
          +	if (!len)
          +		goto overflow;
          +
          +	for (padding = (int)width - len; padding > 0; padding--) {
          +		if (m->count + 1 >= m->size)
          +			goto overflow;
          +		m->buf[m->count++] = ' ';
          +	}
          +
          +	if (m->count + len >= m->size)
          +		goto overflow;
          +
          +	memcpy(m->buf + m->count, tmp, len);
          +	m->count += len;
          +	return;
          +
          +overflow:
          +	seq_set_overflow(m);
          +}
          +EXPORT_SYMBOL(seq_put_decimal_ull_width);
          +
          +/**
          + * seq_put_hex_ll - put a number in hexadecimal notation
          + * @m: seq_file identifying the buffer to which data should be written
          + * @delimiter: a string which is printed before the number
          + * @v: the number
          + * @width: a minimum field width
          + *
          + * seq_put_hex_ll(m, "", v, 8) is equal to seq_printf(m, "%08llx", v)
          + *
          + * This routine is very quick when you show lots of numbers.
          + * In usual cases, it will be better to use seq_printf(). It's easier to read.
          + */
          +void seq_put_hex_ll(struct seq_file *m, const char *delimiter,
          +				unsigned long long v, unsigned int width)
          +{
          +	unsigned int len;
          +	int i;
          +
          +	if (delimiter && delimiter[0]) {
          +		if (delimiter[1] == 0)
          +			seq_putc(m, delimiter[0]);
          +		else
          +			seq_puts(m, delimiter);
          +	}
          +
          +	/* If x is 0, the result of __builtin_clzll is undefined */
          +	if (v == 0)
          +		len = 1;
          +	else
          +		len = (sizeof(v) * 8 - __builtin_clzll(v) + 3) / 4;
          +
          +	if (len < width)
          +		len = width;
          +
          +	if (m->count + len > m->size) {
          +		seq_set_overflow(m);
          +		return;
          +	}
          +
          +	for (i = len - 1; i >= 0; i--) {
          +		m->buf[m->count + i] = hex_asc[0xf & v];
          +		v = v >> 4;
          +	}
          +	m->count += len;
          +}
          +EXPORT_SYMBOL(seq_put_hex_ll);
