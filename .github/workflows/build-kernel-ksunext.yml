# Corrections to the v17 notes:
#  - The old project node (console 0x80000, record 0x40000, ftrace 0x20000,
#    pmsg 0x20000) sums to exactly 0x100000, but the driver's dump area is
#    region - console - ftrace - pmsg (fs/pstore/ram.c; the record size is
