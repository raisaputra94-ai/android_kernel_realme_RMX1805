           /*
            * selinux_kernel_status_page
          
          PATCHEOF
          git apply --check /tmp/resukisu-hooks.patch
          git apply /tmp/resukisu-hooks.patch
          echo "=== applied changes ==="
          git diff --stat | tail -12

      - name: Fetch ReSukiSU driver (official setup.sh)
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s --
          ls -la drivers/kernelsu

      - name: Install aarch64 toolchain (GCC 9.4, kernel.org crosstool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev ccache zip
          mkdir -p toolchain
          cd toolchain
          curl -sSL -o gcc.tar.xz \
            https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/9.4.0/x86_64-gcc-9.4.0-nolibc-aarch64-linux.tar.xz
          tar -xf gcc.tar.xz
          ./gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc --version

      - name: ccache setup
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rmx1805-kernel-${{ github.ref_name }}
          max-size: 2G

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-
          export PATH="/usr/lib/ccache:$PATH"
          make RMX1805_ArcticFox-KSU_defconfig
          make -j$(nproc) CC="ccache $CROSS_COMPILEgcc" \
            KCFLAGS="-Idrivers/gpu/msm \
                     -Idrivers/bluetooth \
                     -Idrivers/input/touchscreen/ili9881_18663 \
                     -Idrivers/media/platform/msm/camera_v2/isp \
                     -Idrivers/media/platform/msm/camera_v2/common \
                     -Idrivers/media/platform/msm/camera_v2/sensor/io \
                     -Idrivers/qihoo \
                     -Idrivers/usb/gadget \
                     -Idrivers/platform/msm/ipa/ipa_v2 \
                     -Idrivers/platform/msm/ipa/ipa_clients"
          ls -lh arch/arm64/boot/Image arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          rm -rf .git .github
          cp ../arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          # Adapted for Realme 2 / Realme C1 (RMX1805) - ArcticFox ReSukiSU kernel

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ArcticFox ReSukiSU Kernel for Realme 2 (RMX1805)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RMX1805
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot;

          # No ramdisk modifications - pure kernel swap.
          # The Image.gz-dtb in the zip root is auto-detected and replaces the boot image kernel.

          write_boot;
          ## end boot install
          AK3EOF
          zip -r9 ../RMX1805-ArcticFox-ReSukiSU-Kernel.zip . -x "*.git*"
          cd ..
          ls -lh RMX1805-ArcticFox-ReSukiSU-Kernel.zip
          unzip -l RMX1805-ArcticFox-ReSukiSU-Kernel.zip | grep -E "Image.gz-dtb|anykernel.sh"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: RMX1805-ArcticFox-ReSukiSU-Kernel-${{ github.sha }}
          path: RMX1805-ArcticFox-ReSukiSU-Kernel.zip
          retention-days: 14
