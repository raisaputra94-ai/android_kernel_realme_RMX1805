          +	if (info.enabled) {
          +		static_branch_enable(&susfs_is_hide_sus_mnts_for_non_su_procs_enabled);
          +	} else {
          +		static_branch_disable(&susfs_is_hide_sus_mnts_for_non_su_procs_enabled);
          +	}
