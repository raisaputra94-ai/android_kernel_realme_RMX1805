          +	*copied_size += tmp_size;
          +	if (*copied_size >= bufsize) {
          +		SUSFS_LOGE("bufsize is not big enough to hold the string.\n");
          +		return -EINVAL;
          +	}
          +	memcpy(buf_ptr, config_string, tmp_size);
          +	return 0;
