        run: |
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          echo "pstore choice: $PSTORE_CHOICE"
          grep "PSTORE" .config
          if [ "$PSTORE_CHOICE" = "enabled" ]; then
            grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          else
            ! grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          fi

      - name: Pack AnyKernel3 zip
        run: |
          # AnyKernel3 at 10a3586: last version with flash_dtbo() and
          # lowercase-var backwards compat (user's proven anykernel.sh)
          git clone --quiet https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          git checkout -q 10a35863de9b7715da84e4d6186155423a5415b9
          rm -rf .git .github
          cp ../arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ArcticFox BakaSU Kernel for RMX1805/RMX1809/RMX1811
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RMX1805
          device.name2=RMX1809
          device.name3=RMX1811
          supported.versions=9 - 14.1
          '; } # end properties

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_block_display=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          # flash boot and dtbo (dtbo is skipped automatically if not bundled)
          flash_boot;
          flash_dtbo;
          ## end boot install
          AK3EOF
          cd ..
          # bundle kernel modules (stripped) for do.modules=1
          mkdir -p anykernel3/modules/system/lib/modules
          rm -f anykernel3/modules/system/lib/modules/placeholder
          for ko in $(find drivers net fs -name "*.ko"); do
            cp "$ko" anykernel3/modules/system/lib/modules/
          done
          STRIP=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-strip
          "$STRIP" --strip-unneeded anykernel3/modules/system/lib/modules/*.ko
          ls anykernel3/modules/system/lib/modules/
          cd anykernel3
          ls -lh Image.gz-dtb anykernel.sh
          ls modules/system/lib/modules/ | grep -E "wlan.ko"
          test -f Image.gz-dtb && test -f anykernel.sh && echo "AnyKernel3 payload verified"
          cd ..

      - name: Upload AnyKernel3 (directly flashable)
        uses: actions/upload-artifact@v4
        with:
          name: RMX1805-ArcticFox-BakaSU-Kernel-${{ github.sha }}
          # Upload the payload directly (not a pre-made zip): GitHub zips the
          # artifact once on download, so the downloaded file IS the flashable
          # AnyKernel3 zip. No more zip-inside-zip.
          path: anykernel3/*
          retention-days: 14
