      - name: Fix pstore/ramoops (config + device tree, base only)
        run: |
          cat > /tmp/pstore-fix-v20.sh <<'SHEOF'
          #!/usr/bin/env bash
          #
          # pstore-fix-v20.sh - v20: base node ONLY. The project mode is gone:
          # disabling the base ramoops node leaves NO ramoops device at all
          # (drivers/of/platform.c creates only the first compatible node),
          # so project mode could never work. See the v20 header.
          #   ./pstore-fix-v20.sh            # enabled (default)
          #   ./pstore-fix-v20.sh disabled   # turn pstore off, DT untouched
          # Run from the kernel source root, BEFORE "make <defconfig>".
          set -euo pipefail
          MODE="${1:-enabled}"
          DEFCONFIG="arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig"
          DTS_DIR="arch/arm64/boot/dts/qcom"
          case "$MODE" in enabled|disabled) ;; *) echo "ERROR: mode must be enabled or disabled" >&2; exit 1 ;; esac
          [ -f "$DEFCONFIG" ] || { echo "ERROR: defconfig not found: $DEFCONFIG" >&2; exit 1; }
          echo "pstore-fix-v20: mode=$MODE (region is always base)"
          # --- defconfig: delete the non-standard "#CONFIG_PSTORE_*" comment
          # lines first (scripts/config does not recognise them), then set.
          sed -i '/^#CONFIG_PSTORE_/d' "$DEFCONFIG"
          if [ "$MODE" = "enabled" ]; then
            ./scripts/config --file "$DEFCONFIG" \
              --enable CONFIG_PSTORE \
              --enable CONFIG_PSTORE_RAM \
              --enable CONFIG_PSTORE_CONSOLE \
              --enable CONFIG_PSTORE_PMSG \
              --disable CONFIG_PSTORE_FTRACE
          else
            ./scripts/config --file "$DEFCONFIG" \
              --disable CONFIG_PSTORE \
              --disable CONFIG_PSTORE_RAM \
              --disable CONFIG_PSTORE_CONSOLE \
              --disable CONFIG_PSTORE_PMSG \
              --disable CONFIG_PSTORE_FTRACE
          fi
          echo "=== pstore lines in $DEFCONFIG ==="
          grep "PSTORE" "$DEFCONFIG"
          if [ "$MODE" = "enabled" ]; then
            grep -q "^CONFIG_PSTORE=y$" "$DEFCONFIG" || exit 1
            grep -q "^CONFIG_PSTORE_RAM=y$" "$DEFCONFIG" || exit 1
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" "$DEFCONFIG" || exit 1
            grep -q "^CONFIG_PSTORE_PMSG=y$" "$DEFCONFIG" || exit 1
          else
            echo "pstore-fix-v20: done (pstore disabled, device tree untouched)"
            exit 0
          fi
          # --- device tree: fix base node, DELETE project node ---
          command -v python3 >/dev/null || { echo "ERROR: python3 not found" >&2; exit 1; }
          python3 - "$DTS_DIR" <<'PY'
          import re, sys, pathlib
          dts_dir = pathlib.Path(sys.argv[1])
          REGION_SIZE = 0x100000
          # base node (msm8953.dtsi, inside &reserved-memory)
          p = dts_dir / "msm8953.dtsi"
          s = p.read_text()
          m = re.search(r'ramoops@0x91400000\s*\{[^{}]*\};', s)
          if not m:
              sys.exit("ERROR: ramoops@0x91400000 node not found in msm8953.dtsi")
          block = m.group(0)
          indent = re.search(r'\n([ \t]*)compatible', block)
          ind = indent.group(1) if indent else "\t\t\t"
          nl = "\r\n" if "\r\n" in s else "\n"
          block = re.sub(r'[ \t]*status\s*=\s*"disabled";\r?\n', '', block)
          for prop in ("record-size", "console-size", "pmsg-size", "ftrace-size"):
              block = re.sub(r'[ \t]*' + prop + r'\s*=\s*<[^>]*>;?\r?\n', '', block)
          add = nl.join([ind + "record-size = <0x20000>;",
                         ind + "console-size = <0x40000>;",
                         ind + "pmsg-size = <0x20000>;"]) + nl
          block = re.sub(r'(compatible\s*=\s*"ramoops";\r?\n(?:[ \t]*reg\s*=\s*<[^>]*>;\r?\n)?)',
                         lambda mm: mm.group(1) + add, block, count=1)
          assert 'record-size = <0x20000>' in block, "base node record-size edit failed"
          assert 'console-size = <0x40000>' in block, "base node console-size edit failed"
          assert 'pmsg-size = <0x20000>' in block, "base node pmsg-size edit failed"
          assert 'status = "disabled"' not in block, "base node still disabled"
          assert REGION_SIZE - 0x40000 - 0 - 0x20000 >= 0x20000, "base node sizes leave no dump area"
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)
          print("msm8953.dtsi: base ramoops node fixed (record 0x20000, console 0x40000, pmsg 0x20000, enabled)")
          print("--- edited base node ---")
          print(block)
          # project node (sdm450-pmi632.dtsi): DELETE outright, never disable
          p = dts_dir / "sdm450-pmi632.dtsi"
          s = p.read_text()
          m = re.search(r'(?m)^[ \t]*pstore: ramoops@92100000\s*\{[^{}]*\};\r?\n', s)
          if not m:
              sys.exit("ERROR: pstore: ramoops@92100000 node not found in sdm450-pmi632.dtsi - tree changed, stop instead of building blind")
          s = s[:m.start()] + s[m.end():]
          assert "ramoops@92100000" not in s, "project node deletion failed"
          p.write_text(s)
          print("sdm450-pmi632.dtsi: project ramoops node DELETED (was second, never-probed area)")
          PY
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "=== git diff --stat (DT + defconfig) ==="
            git diff --stat | tail -5 || true
            echo "=== git diff: msm8953.dtsi + sdm450-pmi632.dtsi ==="
            git diff -- arch/arm64/boot/dts/qcom/msm8953.dtsi arch/arm64/boot/dts/qcom/sdm450-pmi632.dtsi || true
          fi
          echo "pstore-fix-v20: done"
          echo "After flashing: dmesg | grep -i ramoops   (expect 'ramoops: attached 0x100000@0x91400000')"
          SHEOF
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          bash /tmp/pstore-fix-v20.sh "$PSTORE_CHOICE"

      - name: Install aarch64 toolchain (GCC 9.4, kernel.org crosstool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev zip
          mkdir -p toolchain
          cd toolchain
          curl -sSL -o gcc.tar.xz \
            https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/9.4.0/x86_64-gcc-9.4.0-nolibc-aarch64-linux.tar.xz
          tar -xf gcc.tar.xz
          ./gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc --version

      - name: DEBUG susfs_compat.mk gate conditions (one per line)
        run: |
          export ARCH=arm64
          # v14 proved .config HAS KALLSYMS_ALL=y, yet susfs_compat.mk:35
          # still fails. Print each of its 7 conditions separately so the
          # log names the failing one. Uses the same paths make sees.
          make RMX1805_ArcticFox-KSU_defconfig >/dev/null 2>&1
          echo "== 1 VERSION.PATCHLEVEL =="
          echo "$(awk '$1 == "VERSION" {print $3}' Makefile).$(awk '$1 == "PATCHLEVEL" {print $3}' Makefile)"
          echo "== 2/3/4 .config =="
          grep -E '^CONFIG_(ARM64|KSU|KALLSYMS_ALL)=' .config || echo "(missing)"
          echo "== 5 marker file =="
          ls -la BakaSU/kernel/.susfs-4.9-auto-reviewed 2>&1
          cat BakaSU/kernel/.susfs-4.9-auto-reviewed 2>&1
          echo "== 5b same file via the symlink drivers/kernelsu =="
          ls -la drivers/kernelsu/.susfs-4.9-auto-reviewed 2>&1
          echo "== 6 SUSFS_VERSION line =="
          grep -n 'define SUSFS_VERSION' include/linux/susfs.h || echo "(missing)"
          echo "== 7 forbidden strings in hooks.c / selinuxfs.c =="
          grep -n 'ksu_selinux_hide_running\|ksu_hide_setprocattr\|fake_state' security/selinux/hooks.c security/selinux/selinuxfs.c || echo "(none found - good)"
          echo "== end debug =="

      - name: Build kernel
        run: |
          export ARCH=arm64
          GCC_DIR=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin
          # No ccache in v23 (removed at the user's call): CROSS_COMPILE
          # points straight at the real toolchain, so every run compiles
          # the whole kernel from scratch. Slower, but no cache directory,
          # no third-party cache action, and no stale-cache doubt.
          export CROSS_COMPILE=$GCC_DIR/aarch64-linux-
          make RMX1805_ArcticFox-KSU_defconfig
          # v20 fail-fast #2: prove the built .config carries pstore BEFORE
          # the parallel build, so a config regression fails here loudly
          # instead of uploading a kernel that silently has no pstore.
          PSTORE_CHOICE2="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE2" ]; then PSTORE_CHOICE2="enabled"; fi
          if [ "$PSTORE_CHOICE2" = "enabled" ]; then
            grep "PSTORE" .config
            grep -q "^CONFIG_KALLSYMS_ALL=y$" .config || { echo "ERROR: KALLSYMS_ALL not y in .config after defconfig (susfs_compat.mk needs it)" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE=y$" .config || { echo "ERROR: PSTORE not y in .config after defconfig" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE_RAM=y$" .config || { echo "ERROR: PSTORE_RAM not y in .config after defconfig" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || { echo "ERROR: PSTORE_CONSOLE not y in .config after defconfig - pstore-fix did not reach defconfig" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE_PMSG=y$" .config || { echo "ERROR: PSTORE_PMSG not y in .config after defconfig - pstore-fix did not reach defconfig" >&2; exit 1; }
          fi
          # SUSFS fail-fast: the patch step forced these; prove they survived defconfig.
          grep -q "^CONFIG_KSU=y$" .config || { echo "ERROR: KSU not y in .config after defconfig" >&2; exit 1; }
          if grep -q "^CONFIG_KSU_MANUAL_HOOK=y$" .config; then echo "ERROR: MANUAL_HOOK must stay off (inline-hook method)" >&2; exit 1; fi
          if grep -q "^CONFIG_KSU_TRACEPOINT_HOOK=y$" .config; then echo "ERROR: TRACEPOINT_HOOK must stay off (inline-hook method)" >&2; exit 1; fi
          grep -q "^CONFIG_KSU_SUSFS=y$" .config || { echo "ERROR: SUSFS not y in .config after defconfig" >&2; exit 1; }
          grep -q "^CONFIG_KSU_SUSFS_SUS_KSTAT=y$" .config || { echo "ERROR: SUS_KSTAT not y in .config after defconfig" >&2; exit 1; }
          # Host-tool guard: see v18 header. Build host tools serially
          # first so parallel jobs do not race to rebuild fixdep, then
          # prove fixdep is executable before the parallel build starts.
          make ARCH=arm64 -j1 scripts
          chmod +x scripts/basic/fixdep
          ls -l scripts/basic/fixdep
          test -x scripts/basic/fixdep
          make -j$(nproc) LOCALVERSION= \
            KCFLAGS="-Idrivers/gpu/msm \
                     -Idrivers/bluetooth \
                     -Idrivers/input/touchscreen/ili9881_18663 \
                     -Idrivers/media/platform/msm/camera_v2/isp \
                     -Idrivers/media/platform/msm/camera_v2/common \
                     -Idrivers/media/platform/msm/camera_v2/sensor/io \
                     -Idrivers/qihoo \
                     -Idrivers/usb/gadget \
                     -Idrivers/platform/msm/ipa/ipa_v2 \
                     -Idrivers/platform/msm/ipa/ipa_clients"
          ls -lh arch/arm64/boot/Image arch/arm64/boot/Image.gz-dtb

      - name: Verify pstore in built .config
        run: |
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          echo "pstore choice: $PSTORE_CHOICE"
          grep "PSTORE" .config
          if [ "$PSTORE_CHOICE" = "enabled" ]; then
            grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          else
            ! grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          fi

      - name: Pack AnyKernel3 zip
        run: |
          # AnyKernel3 at 10a3586: last version with flash_dtbo() and
          # lowercase-var backwards compat (user's proven anykernel.sh)
          git clone --quiet https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          git checkout -q 10a35863de9b7715da84e4d6186155423a5415b9
          rm -rf .git .github
          cp ../arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ArcticFox BakaSU (SUSFS v2.3.0 inline-hook) Enforcing Kernel for RMX1805/RMX1809/RMX1811
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RMX1805
          device.name2=RMX1809
          device.name3=RMX1811
          supported.versions=9 - 14.1
          '; } # end properties

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_block_display=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          # enforce SELinux: replace permissive token with enforcing (v27)
          patch_cmdline androidboot.selinux=permissive androidboot.selinux=enforcing;

          # flash boot and dtbo (dtbo is skipped automatically if not bundled)
          flash_boot;
          flash_dtbo;
          ## end boot install
          AK3EOF
          cd ..
          cd anykernel3
          ls -lh Image.gz-dtb anykernel.sh
          test -f Image.gz-dtb && test -f anykernel.sh && echo "AnyKernel3 payload verified"
          cd ..

      - name: Upload AnyKernel3 (directly flashable)
        uses: actions/upload-artifact@v4
        with:
          name: RMX1805-ArcticFox-BakaSU-SUSFS-Kernel-${{ github.sha }}
          # Upload the payload directly (not a pre-made zip): GitHub zips the
          # artifact once on download, so the downloaded file IS the flashable
          # AnyKernel3 zip. No more zip-inside-zip.
          path: anykernel3/*
          retention-days: 14
