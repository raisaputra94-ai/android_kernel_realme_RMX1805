# v26-ksubackslashxx-nodt2w (2026-11-07): v25 verbatim MINUS the DT2W step.
# DT2W is TEMPORARILY REMOVED, not deleted for good: the combined patch
# (dt2w-rmx1805-combined.patch, md5 7610046f8ab75abffabd6e41d562e6e9) is
# still embedded in v25, which is untouched on disk, so DT2W comes back
# by re-adding the "Apply DT2W combined patch" step from v25 verbatim.
# Everything else is v25 untouched: backslashxx KernelSU v3.3.1 hooks,
# pstore base fix, fixdep guard, 2GB low-RAM tweaks, toolchain,
# AnyKernel3 packing, and the pstore input (default enabled).
# NOTE: without the DT2W patch the touchscreen driver is stock, so
# double-tap-to-wake will not work on a v26 kernel. The original mikasa
# module (dt2w-realme2) has nothing to enable. Re-add DT2W (v25) when
# the wake feature is wanted again.
#
# v25-ksubackslashxx-dt2w (2026-11-07): v24 verbatim MINUS BakaSU, PLUS
# backslashxx KernelSU v3.3.1 (tag v3.3.1-38, commit feeec8e, master).
# The root solution is swapped; everything else is untouched: pstore base
# fix, fixdep guard, 2GB low-RAM tweaks, DT2W combined patch (exact),
# toolchain, AnyKernel3 packing, and the pstore input (default enabled).
#
# WHY THE SWAP NEEDS A NEW HOOKS PATCH (not just a new driver fetch):
# backslashxx v3.3.1 is a KernelSU fork whose driver differs from BakaSU
# in three ways that all matter here (all verified against the live
# backslashxx/KernelSU master, tag v3.3.1-38, 2026-11-07):
#   1. There is NO CONFIG_KSU_MANUAL_HOOK and NO CONFIG_KSU_TRACEPOINT_HOOK
#      in its Kconfig. The manual-hook call sites are guarded by plain
#      CONFIG_KSU. So the BakaSU patch's MANUAL_HOOK guard would compile
#      every hook call OUT (silent no-root kernel). The new patch guards
#      everything with CONFIG_KSU.
#   2. The driver provides exactly four hook entry points as globals:
#      ksu_handle_execveat, ksu_handle_faccessat, ksu_handle_stat (all in
#      kernel/feature/sucompat.c) and ksu_handle_sys_reboot (in
#      kernel/supercall/supercall.c), with the same signatures BakaSU had.
#      It does NOT provide ksu_handle_post_execveat, ksu_handle_vfs_read,
#      or ksu_handle_input_handle_event, so those calls are dropped.
#      (ksu_handle_newfstat_ret / ksu_handle_fstat64_ret DO exist, but
#      they are not needed: backslashxx injects its init rc via its LSM
#      hooks, which are on by default. If the manager app cannot connect
#      after flashing, adding those two calls to fs/stat.c is the first
#      thing to try.)
#   3. The hook functions are global ONLY while CONFIG_KSU_TAMPER_SYSCALL_TABLE
#      and CONFIG_KSU_HACK_ARM64_BRANCH_LINK are both off. Either one on
#      makes them `static __always_inline`, which would fail the link.
#      Both default to off (n) for a built-in CONFIG_KSU=y build, and the
#      hooks step forces them off in the defconfig and fails fast if
#      either is y.
# WHAT THE NEW HOOKS PATCH DOES (109 lines, generated from the pristine
# tree at HEAD and verified to apply cleanly):
#   - fs/exec.c: drop the old ksu_execveat_hook bool and the
#     ksu_handle_execveat_sucompat variant; call ksu_handle_execveat
#     directly under CONFIG_KSU. No post_execveat, no __attribute__((hot)).
#   - drivers/input/input.c: DELETE the input hook block (no such
#     function in backslashxx).
#   - fs/read_write.c: DELETE the vfs_read hook block (no such function).
#   - kernel/reboot.c: ADD the sys_reboot hook (extern + call, CONFIG_KSU).
#   - fs/open.c and fs/stat.c: NOT TOUCHED. The pristine tree already
#     calls ksu_handle_faccessat (open.c) and ksu_handle_stat (stat.c,
#     in vfs_fstatat, which covers newfstatat and fstatat64) under
#     CONFIG_KSU, and those two functions exist in backslashxx.
#   - security/selinux/*: NOT TOUCHED. The BakaSU patch exported
#     sel_mutex / sel_handle_status_ops / write_op / policy_rwlock /
#     selinux_status_page because the old driver needed them. Backslashxx
#     reaches policy_rwlock via kallsyms (weak extern + fallback) and
#     never touches the others, so the exports are unnecessary.
#   - defconfig: the tree already ships CONFIG_KSU=y. The step deletes
#     any stale TRACEPOINT/MANUAL_HOOK lines and forces TAMPER_SYSCALL_TABLE
#     and HACK_ARM64_BRANCH_LINK off, then fails fast if any of the four
#     wrong states is present.
# MANAGER APP: backslashxx KernelSU uses the standard KernelSU manager
# (package me.weishu.kernelsu). The BakaSU manager app will NOT work with
# this kernel - install the KernelSU manager from the backslashxx release
# (or the official KernelSU manager). The SELinux enforcing module v1.0
# (sepolicy.rule, ksud) is manager-agnostic and still applies.
# UNTESTED: this workflow has not been run on GitHub yet. It has not been
# flashed or booted. The DT2W patch and the pstore/low-RAM steps are
# byte-identical to v24 (proven), but the backslashxx integration itself
# is new and must be proven by a GitHub run + flash + `su` test.
#
# v24-dt2w-combined-nocache (2026-10-29): v23 verbatim
# MINUS nothing, PLUS exactly one change: the DT2W step now embeds the
# user's uploaded dt2w-rmx1805-combined.patch (md5 7610046f8ab75abffabd6e41d562e6e9)
# instead of ili9881_dt2w_light_true.patch. That uploaded patch = Light
# driver changes (finger_report/platform/userspace, 12 lines) + ONE extra
# DTS line: regulator-always-on in the iovdd_gpio_vreg node of
# arch/arm64/boot/dts/qcom/msm8953-mtp.dtsi. It contains NO config.c /
# default-on change, so proc still boots at 0 and the original module or
# manual echo is still needed to enable. This is NOT the set-aside
# ili9881_dt2w_combined_v2.patch (Light + default-on) from 2026-10-29
# 13:00 SGT, which must not be used. No-cache v23 base is untouched:
# no ccache step, package, or wrapper anywhere. Caveat carried over
# from the v23 check: the DTS hunk is in the sdm450-pmi632-mtp-s3 DTB
# chain but not the plain sdm450-pmi632 chain, and which DTB the
# bootloader picks on current builds is unproven, so the DTS line is
# not guaranteed to reach the booted DTB. User confirmed building this version 2026-10-29 13:09 SGT; v23 remains on disk untouched.
#
# v23-dt2w-light-nocache (2026-10-29): v22 verbatim MINUS ccache.
# The user said they do not need cache anymore in this workflow, and
# they are right: ccache was purely a speed optimisation, never a
# correctness requirement. Everything else is carried over from v22
# untouched: pstore base fix, BakaSU hooks, fixdep guard, 2GB low-RAM
# tweaks, DT2W Light patch (exact, no default-on), toolchain, AnyKernel3
# packing, and the pstore input (default enabled).
#
# WHAT WAS REMOVED, ALL THREE PIECES (removing only one would leave a
# half-cache behind, so all three go together):
#   1. The "ccache setup" step (hendrikmuhs/ccache-action@v1.2, key
#      rmx1805-kernel-<branch>, max-size 2G) - the step that restored
#      and saved the cache directory across runs.
#   2. The ccache package from the apt install line in the toolchain
#      step (bc bison flex libssl-dev zip remain).
#   3. The ccache-bin wrapper loop in "Build kernel" (only gcc went
#      through ccache; the rest exec'd the real binary). CROSS_COMPILE
#      now points straight at the real toolchain directory.
# TRADE-OFF, STATED PLAINLY: every GitHub run now compiles the full
# kernel from scratch, so runs will take longer than the cached runs
# did (v18's 8m4s run benefited from cache). In return there is no
# 2 GB cache to store, no third-party cache action in the flow, and no
# cache-related doubt about whether a build is fresh. If the slower
# runs ever hurt, v22 (with cache) is still on disk untouched and can
# be pushed again instead - no work is lost by this removal.
#
# v22-dt2w-light (2026-10-29): v20 verbatim + ONE new step, "Apply DT2W
# Light patch (ILI9881, exact)", inserted immediately before "Build kernel".
# Nothing else changed: pstore base fix, BakaSU hooks, fixdep guard, 2GB
# low-RAM tweaks, toolchain/ccache, AnyKernel3 packing, and the pstore
# input (default enabled) are all carried over from v20 untouched.
#
# WHAT THE DT2W STEP DOES (driver source only, no defconfig change):
#   Applies ili9881_dt2w_light_true.patch to the checked-out tree, then
#   fails fast if any marker is missing, BEFORE the parallel build starts.
#   This patch is EXACTLY the user's own June 2026 patches, with NO
#   assistant enhancement, NO combined default-on change, NO other edit:
#   - finger_report.c: gesture report key KEY_F4 -> KEY_WAKEUP (143,
#     System Wake Up) + set_bit(KEY_WAKEUP). F4 is ignored by Lineage;
#     WAKEUP is the key Android wakes on, with no power-menu side
#     effects. The KEY_POWER report stays inside its disabled #if 0
#     block, unchanged.
#   - platform.c: fb notifier handles FB_EVENT_BLANK as well as
#     FB_EARLY_EVENT_BLANK; the IRQ-disable on suspend is now conditional
#     on gesture being off; enable_irq_wake() re-added after ESD reset.
#   - userspace.c: ilitek_proc_gesture_write "on" also sets g_gesture=1
#     and "off" also sets g_gesture=0, keeping g_gesture in sync with
#     isEnableGesture on the /proc/ilitek/gesture path the original
#     Magisk module uses. The oppo proc path already set g_gesture.
#   - config.c: UNTOUCHED. The step fails fast if config.c shows any
#     default-on change, so this build cannot silently become the
#     combined version. The DT2W default stays OFF at boot.
#   The user's dt2w-irq-fix.patch is NOT applied separately: its single
#   hunk is already inside dt2w-full-fix.patch, so applying it again
#   would conflict with itself.
# EXPECTED AFTER FLASHING A v22 BUILD (test, in order):
#   1. uname -a timestamp must be newer than the v21 build (gate: the
#      flash actually took the new kernel, not the old boot.img).
#   2. cat /proc/touchpanel/double_tap_enable -> 0, WITHOUT any echo.
#      That is CORRECT for this version: Light does not change the
#      default. A reading of 1 here would mean the wrong patch ran.
#   3. Enable DT2W the original way: install the original Magisk module
#      (id dt2w-realme2, service.sh writes "on" to /proc/ilitek/gesture
#      after boot_completed + 5 s), OR manually: echo 1 >
#      /proc/touchpanel/double_tap_enable. Then lock, wait 10 s,
#      double-tap centre -> screen wakes (KEY_WAKEUP).
# NOTE: a ROM flash replaces boot.img and therefore this kernel - reflash
#   the proven v22 kernel after any ROM flash if DT2W is still wanted.
#   The Light patch file itself is EMBEDDED below as a heredoc (the
#   GitHub checkout does not have this workspace's patch file), and its
#   md5 is recorded in the step so the run log proves which patch ran.
#
# v20-pstore-base-only (2026-10-28): v19 with the broken project mode REMOVED.
# WHY: on-device proof 2026-10-28 (kernel 4.9.337-arcticfox-reei, v19 project run):
#   base node status = "disabled", project node resized exactly as v19 intended
#   (console 0x40000, record 0x20000, pmsg 0x20000), yet dmesg shows NO ramoops
#   line at all and /dev/pmsg0 does not exist. The driver never probed.
# ROOT CAUSE (drivers/of/platform.c in this tree):
#   of_platform_default_populate_init() creates a platform device for ONLY the
#   FIRST node with compatible = "ramoops" under /reserved-memory, found by
#   of_find_compatible_node(), which does NOT check status. The base node
#   (0x91400000) comes first in the DT, so disabling it makes
#   of_platform_device_create() return NULL and the project node is NEVER tried.
#   Disabling the base node therefore does not hand the slot to the project
#   node - it deletes the slot entirely. v17/v18/v19 project mode could never
#   work, regardless of sizes or config. This is proven, not a theory.
# FIX IN v20:
#   - pstore_region input REMOVED. There is no region choice anymore, so the
#     broken project mode cannot be selected by mistake (including by
#     re-running an old run, which reuses its original inputs).
#   - The base node (0x91400000, the vendor's original ramoops area) is FIXED
#     in place: single-cell sizes, record 0x20000, console 0x40000,
#     pmsg 0x20000, no ftrace, any status="disabled" removed. Dump area =
#     0x100000 - 0x40000 - 0 - 0x20000 = 0xA0000 = 5 records (fs/pstore/ram.c:
#     dump area = size - console - ftrace - pmsg; record size is NOT
#     subtracted).
#   - The project node (ramoops@92100000 in sdm450-pmi632.dtsi) is DELETED
#     outright (not disabled - disabling a ramoops node is exactly the bug
#     above). It is referenced nowhere else in the tree, so deleting it only
#     removes a second, never-probed ramoops area. The S88051AA1 node in the
#     unused mtp-s3 file is left alone (that file is included by no DTS).
#   - Fail-fast at THREE points, so a bad kernel can never again upload
#     silently: (1) defconfig after the pstore edit, (2) .config immediately
#     after `make defconfig` and BEFORE the parallel build, (3) built .config
#     after the build (kept from v19, strengthened). The pstore step also
#     prints the edited base node and the git diff, so the run log itself
#     proves what changed.
#   - pstore enabled/disabled choice KEPT (default enabled). Disabled means
#     no pstore at all by design, and the DT is left untouched in that case.
# EXPECTED AFTER FLASHING A v20 ENABLED BUILD:
#   dmesg | grep -i ramoops  ->  "ramoops: attached 0x100000@0x91400000"
#   and "Registered ramoops as persistent store backend"; /dev/pmsg0 exists;
#   after a warm `adb reboot`, /sys/fs/pstore contains console-ramoops.
#   NOTE: a ROM flash replaces boot.img and therefore this kernel - reflash
#   the proven v20 kernel after any ROM flash if pstore is still wanted.
#
# v18-fixdep-guard (2026-10-26): v17 + a host-tool guard in the Build step.
# DIAGNOSIS of the 2026-10-26 06:45 UTC run (commit e08a81f, pstore=enabled):
# the BakaSU hooks, low-RAM tweaks, ramoops DT fix, and pstore config
# steps ALL succeeded (DT diff stat shown, all four PSTORE lines =y).
# The first fatal error was later, in the Build step, before any DTB or
# kernel code compiled:
#   /bin/sh: 1: scripts/basic/fixdep: Permission denied
#   make[1]: *** [Kbuild:21: kernel/bounds.s] Error 126
#   make: *** [Makefile:1240: prepare0] Error 2
# so the ramoops DT fix is NOT the cause and was NOT tested by that run.
# The log alone does not prove whether fixdep lost its execute bit or
# parallel jobs raced to rebuild it (both parallel jobs failed on fixdep
# at the same second, 06:45:38). The guard below addresses both: it
# builds the host tools serially first, forces fixdep executable, and
# prints ls -l so the next log proves fixdep's mode at build start.
# If the next run still fails on fixdep, that ls -l line is the evidence
# that narrows it to a filesystem/runner issue rather than a race.
#
# v19-pstore-script (2026-10-26): v18 + corrected pstore/ramoops fix.
# The two old steps (DT fix + pstore toggle) are now ONE step that writes
# and runs the fix script inline (no extra file to commit).
# Corrections to the v17 notes:
#  - The old project node (console 0x80000, record 0x40000, ftrace 0x20000,
#    pmsg 0x20000) sums to exactly 0x100000, but the driver's dump area is
#    region - console - ftrace - pmsg (fs/pstore/ram.c; the record size is
#    NOT subtracted) = 0x40000 = one record. So that node is NOT proven to
#    fail. What is proven: the base node (msm8953.dtsi) has a two-cell
#    record-size, the driver reads 0, and it fails with "must be non-zero".
#  - The driver allows only ONE ramoops area; the first node that probes
#    successfully wins.
# New pstore_region input:
#   project (default): disable the base node, resize the project node
#                      (console 0x40000, record 0x20000, pmsg 0x20000).
#   base:              fix the base node instead and leave the project node
#                      alone. Use it if dmesg shows no "ramoops: attached".
# Test: build, flash, dmesg | grep -i ramoops. Not compiled or boot-tested.
#
# v16-pstore-toggle (2026-10-26): base is the GitHub ArcticFox workflow
# build-kernel-bakasu.yml as fetched 2026-10-26 (600 lines, body identical
# to the local v15 file except v15's version header, which the GitHub copy
# does not carry). NO other step changed.
#
# NEW: a workflow_dispatch select box for pstore (ramoops).
#   pstore = enabled  (default): PSTORE + PSTORE_RAM + PSTORE_CONSOLE +
#                          PSTORE_PMSG are forced on in the defconfig
#                          before the build, so the built kernel keeps a
#                          console log across a reboot (last-kmsg) and
#                          saves panic/oops dumps to RAM.
#   pstore = disabled: all four are forced off; no pstore code is built.
# Push-triggered runs have no dispatch input, so they fall back to
# "enabled" inside the step (see the -z check).
#
# WHAT "FIX" MEANS HERE: the defconfig already shipped PSTORE=y and
# PSTORE_RAM=y, but PSTORE_CONSOLE and PSTORE_PMSG were off, so no
# running console log was kept. This toggle turns those two on in the
# enabled case. Pstore covers kernel panic/oops/console only, not
# userspace HAL crashes (those go to tombstones).
#
# The defconfig ships PSTORE_FTRACE/PMSG/CONSOLE as non-standard
# "#CONFIG_...=n" comments, which scripts/config does not recognise as
# set/unset lines; the pstore step deletes those three comment lines
# first, so the toggle is the only CONSOLE/PMSG setting in the file.
# PSTORE_FTRACE stays off in both modes (overhead, not needed here).
#
# Build the RMX1805 (ArcticFox) kernel with backslashxx KernelSU integrated,
# then pack it as a flashable AnyKernel3 zip.
#
# FULLY SELF-CONTAINED: this workflow applies the backslashxx manual-hook
# patch itself (see "Integrate backslashxx KernelSU hooks" step), fetches the
# backslashxx driver via the official setup.sh (pinned v3.3.1-38), builds,
# and packs AnyKernel3.
# Just copy this file to .github/workflows/build-kernel.yml and push.

name: Build RMX1805 Kernel (KernelSU backslashxx)

on:
  workflow_dispatch:
    inputs:
      pstore:
        description: 'Pstore (ramoops) logging'
        type: choice
        required: true
        default: 'enabled'
        options:
          - enabled
          - disabled
  push:
    branches:
      - ArcticFox
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Integrate backslashxx KernelSU hooks
        run: |
          cat > /tmp/ksubackslashxx-hooks.patch <<'PATCHEOF'
          diff --git a/drivers/input/input.c b/drivers/input/input.c
          index 6665c2a..1e04d2e 100644
          --- a/drivers/input/input.c
          +++ b/drivers/input/input.c
          @@ -377,20 +377,11 @@ static int input_get_disposition(struct input_dev *dev,
           	return disposition;
           }
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_input_hook __read_mostly;
          -extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          -#endif
          -
           static void input_handle_event(struct input_dev *dev,
           			       unsigned int type, unsigned int code, int value)
           {
           	int disposition = input_get_disposition(dev, type, code, &value);
           
          -	#ifdef CONFIG_KSU
          -	if (unlikely(ksu_input_hook))
          -		ksu_handle_input_handle_event(&type, &code, &value);
          -	#endif
           	if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
           		add_input_randomness(type, code, value);
           
          diff --git a/fs/exec.c b/fs/exec.c
          index 12fbb81..26318c9 100644
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1816,11 +1816,8 @@ out_ret:
            */
           
           #ifdef CONFIG_KSU
          -extern bool ksu_execveat_hook __read_mostly;
           extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
           			void *envp, int *flags);
          -extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          -				 void *argv, void *envp, int *flags);
           #endif
           
           static int do_execveat_common(int fd, struct filename *filename,
          @@ -1834,12 +1831,9 @@ static int do_execveat_common(int fd, struct filename *filename,
           	struct files_struct *displaced;
           	int retval;
           
          -	#ifdef CONFIG_KSU
          -	if (unlikely(ksu_execveat_hook))
          -		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          -	else
          -		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          -	#endif
          +#ifdef CONFIG_KSU
          +	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +#endif
           
           	if (IS_ERR(filename))
           		return PTR_ERR(filename);
          diff --git a/fs/read_write.c b/fs/read_write.c
          index 93a33c0..9012312 100644
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -456,21 +456,10 @@ ssize_t __vfs_read(struct file *file, char __user *buf, size_t count,
           }
           EXPORT_SYMBOL(__vfs_read);
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_vfs_read_hook __read_mostly;
          -extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          -			size_t *count_ptr, loff_t **pos);
          -#endif
          -
           ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
           {
           	ssize_t ret;
           
          -	#ifdef CONFIG_KSU
          -	if (unlikely(ksu_vfs_read_hook))
          -		ksu_handle_vfs_read(&file, &buf, &count, &pos);
          -	#endif
          -
           	if (!(file->f_mode & FMODE_READ))
           		return -EBADF;
           	if (!(file->f_mode & FMODE_CAN_READ))
          diff --git a/kernel/reboot.c b/kernel/reboot.c
          index 2946ed1..8fde32b 100644
          --- a/kernel/reboot.c
          +++ b/kernel/reboot.c
          @@ -277,6 +277,11 @@ static DEFINE_MUTEX(reboot_mutex);
            *
            * reboot doesn't sync: do that yourself before calling this.
            */
          +
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          +#endif
          +
           SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           		void __user *, arg)
           {
          @@ -284,6 +289,9 @@ SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           	char buffer[256];
           	int ret = 0;
           
          +#ifdef CONFIG_KSU
          +	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          +#endif
           	/* We only trust the superuser with rebooting the system. */
           	if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))
           		return -EPERM;
          PATCHEOF
          git apply --check /tmp/ksubackslashxx-hooks.patch
          git apply /tmp/ksubackslashxx-hooks.patch
          echo "=== applied changes ==="
          git diff --stat | tail -12
          # --- defconfig: backslashxx needs CONFIG_KSU=y and nothing else.
          # The tree already ships CONFIG_KSU=y. Delete any stale
          # TRACEPOINT/MANUAL_HOOK lines (left by an earlier BakaSU run),
          # and force the two options that would make the hook functions
          # static (and therefore uncallable from the kernel source) OFF.
          DEFCONFIG="arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig"
          sed -i '/^# CONFIG_KSU_TRACEPOINT_HOOK is not set/d; /^CONFIG_KSU_TRACEPOINT_HOOK=/d; /^# CONFIG_KSU_MANUAL_HOOK is not set/d; /^CONFIG_KSU_MANUAL_HOOK=/d' "$DEFCONFIG"
          sed -i '/^CONFIG_KSU_TAMPER_SYSCALL_TABLE=/d; /^# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set/d' "$DEFCONFIG"
          sed -i '/^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=/d; /^# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set/d' "$DEFCONFIG"
          printf '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set\n# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set\n' >> "$DEFCONFIG"
          grep -q "^CONFIG_KSU=y$" "$DEFCONFIG" || { echo "ERROR: CONFIG_KSU=y missing from defconfig" >&2; exit 1; }
          if grep -q "^CONFIG_KSU_MANUAL_HOOK=y$" "$DEFCONFIG"; then echo "ERROR: stale CONFIG_KSU_MANUAL_HOOK still set" >&2; exit 1; fi
          if grep -q "^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y$" "$DEFCONFIG"; then echo "ERROR: TAMPER_SYSCALL_TABLE is y - hook fns would be static" >&2; exit 1; fi
          if grep -q "^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y$" "$DEFCONFIG"; then echo "ERROR: HACK_ARM64_BRANCH_LINK is y - hook fns would be static" >&2; exit 1; fi
          echo "=== defconfig KSU lines ==="
          grep "CONFIG_KSU" "$DEFCONFIG"

      - name: Apply 2GB low-RAM tweaks
        run: |
          cat > /tmp/lowram-2gb-tweaks.patch <<'LOWRAMEOF'
          diff --git a/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig b/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig
          index a3dd48bb..c9e26861 100644
          --- a/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig
          +++ b/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig
          @@ -67,6 +67,10 @@ CONFIG_PREEMPT=y
           CONFIG_HZ_100=y
           CONFIG_CMA=y
           CONFIG_ZSMALLOC=y
          +# 2GB low-RAM tuning: swap backend for zram (KSM removed 2026-10-06:
          +# pages_shared=24 on-device = 96KB saved vs 221min ksmd CPU, pure overhead)
          +CONFIG_SWAP=y
          +# CONFIG_KSM is not set
           CONFIG_PROCESS_RECLAIM=y
           CONFIG_SECCOMP=y
           CONFIG_HARDEN_BRANCH_PREDICTOR=y
          diff --git a/drivers/staging/android/lowmemorykiller.c b/drivers/staging/android/lowmemorykiller.c
          index 94138c17..d01432ea 100644
          --- a/drivers/staging/android/lowmemorykiller.c
          +++ b/drivers/staging/android/lowmemorykiller.c
          @@ -89,20 +89,24 @@ module_param_named(enable_lmk, enable_lmk, int, 0644);
           static u32 lowmem_debug_level = 1;
           static short lowmem_adj[6] = {
           	0,
          -	1,
          -	6,
          -	12,
          +	100,
          +	200,
          +	300,
          +	900,
          +	906,
           };
           
          -static int lowmem_adj_size = 4;
          +static int lowmem_adj_size = 6;
           static int lowmem_minfree[6] = {
          -	3 * 512,	/* 6MB */
          -	2 * 1024,	/* 8MB */
          -	4 * 1024,	/* 16MB */
          -	16 * 1024,	/* 64MB */
          +	18432,	/* 72MB */
          +	23040,	/* 90MB */
          +	27648,	/* 108MB */
          +	32256,	/* 126MB */
          +	55296,	/* 216MB */
          +	80640,	/* 315MB */
           };
           
          -static int lowmem_minfree_size = 4;
          +static int lowmem_minfree_size = 6;
           static int lmk_fast_run = 1;
           #ifdef VENDOR_EDIT
           static bool lmk_cnt_enable = false;
          diff --git a/mm/vmscan.c b/mm/vmscan.c
          index a0b59fe8..f8bb2df9 100644
          --- a/mm/vmscan.c
          +++ b/mm/vmscan.c
          @@ -149,7 +149,7 @@ struct scan_control {
           /*
            * From 0 .. 100.  Higher means more swappy.
            */
          -int vm_swappiness = 60;
          +int vm_swappiness = 100;
           
           #ifdef VENDOR_EDIT
           /*
          LOWRAMEOF
          git apply --check /tmp/lowram-2gb-tweaks.patch
          git apply /tmp/lowram-2gb-tweaks.patch
          echo "=== low-RAM tweaks applied ==="
          git diff --stat | tail -5

      - name: Fix pstore/ramoops (config + device tree, base only)
        run: |
          cat > /tmp/pstore-fix-v20.sh <<'SHEOF'
          #!/usr/bin/env bash
          #
          # pstore-fix-v20.sh - v20: base node ONLY. The project mode is gone:
          # disabling the base ramoops node leaves NO ramoops device at all
          # (drivers/of/platform.c creates only the first compatible node),
          # so project mode could never work. See the v20 header.
          #   ./pstore-fix-v20.sh            # enabled (default)
          #   ./pstore-fix-v20.sh disabled   # turn pstore off, DT untouched
          # Run from the kernel source root, BEFORE "make <defconfig>".
          set -euo pipefail
          MODE="${1:-enabled}"
          DEFCONFIG="arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig"
          DTS_DIR="arch/arm64/boot/dts/qcom"
          case "$MODE" in enabled|disabled) ;; *) echo "ERROR: mode must be enabled or disabled" >&2; exit 1 ;; esac
          [ -f "$DEFCONFIG" ] || { echo "ERROR: defconfig not found: $DEFCONFIG" >&2; exit 1; }
          echo "pstore-fix-v20: mode=$MODE (region is always base)"
          # --- defconfig: delete the non-standard "#CONFIG_PSTORE_*" comment
          # lines first (scripts/config does not recognise them), then set.
          sed -i '/^#CONFIG_PSTORE_/d' "$DEFCONFIG"
          if [ "$MODE" = "enabled" ]; then
            ./scripts/config --file "$DEFCONFIG" \
              --enable CONFIG_PSTORE \
              --enable CONFIG_PSTORE_RAM \
              --enable CONFIG_PSTORE_CONSOLE \
              --enable CONFIG_PSTORE_PMSG \
              --disable CONFIG_PSTORE_FTRACE
          else
            ./scripts/config --file "$DEFCONFIG" \
              --disable CONFIG_PSTORE \
              --disable CONFIG_PSTORE_RAM \
              --disable CONFIG_PSTORE_CONSOLE \
              --disable CONFIG_PSTORE_PMSG \
              --disable CONFIG_PSTORE_FTRACE
          fi
          echo "=== pstore lines in $DEFCONFIG ==="
          grep "PSTORE" "$DEFCONFIG"
          if [ "$MODE" = "enabled" ]; then
            grep -q "^CONFIG_PSTORE=y$" "$DEFCONFIG" || exit 1
            grep -q "^CONFIG_PSTORE_RAM=y$" "$DEFCONFIG" || exit 1
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" "$DEFCONFIG" || exit 1
            grep -q "^CONFIG_PSTORE_PMSG=y$" "$DEFCONFIG" || exit 1
          else
            echo "pstore-fix-v20: done (pstore disabled, device tree untouched)"
            exit 0
          fi
          # --- device tree: fix base node, DELETE project node ---
          command -v python3 >/dev/null || { echo "ERROR: python3 not found" >&2; exit 1; }
          python3 - "$DTS_DIR" <<'PY'
          import re, sys, pathlib
          dts_dir = pathlib.Path(sys.argv[1])
          REGION_SIZE = 0x100000
          # base node (msm8953.dtsi, inside &reserved-memory)
          p = dts_dir / "msm8953.dtsi"
          s = p.read_text()
          m = re.search(r'ramoops@0x91400000\s*\{[^{}]*\};', s)
          if not m:
              sys.exit("ERROR: ramoops@0x91400000 node not found in msm8953.dtsi")
          block = m.group(0)
          indent = re.search(r'\n([ \t]*)compatible', block)
          ind = indent.group(1) if indent else "\t\t\t"
          nl = "\r\n" if "\r\n" in s else "\n"
          block = re.sub(r'[ \t]*status\s*=\s*"disabled";\r?\n', '', block)
          for prop in ("record-size", "console-size", "pmsg-size", "ftrace-size"):
              block = re.sub(r'[ \t]*' + prop + r'\s*=\s*<[^>]*>;?\r?\n', '', block)
          add = nl.join([ind + "record-size = <0x20000>;",
                         ind + "console-size = <0x40000>;",
                         ind + "pmsg-size = <0x20000>;"]) + nl
          block = re.sub(r'(compatible\s*=\s*"ramoops";\r?\n(?:[ \t]*reg\s*=\s*<[^>]*>;\r?\n)?)',
                         lambda mm: mm.group(1) + add, block, count=1)
          assert 'record-size = <0x20000>' in block, "base node record-size edit failed"
          assert 'console-size = <0x40000>' in block, "base node console-size edit failed"
          assert 'pmsg-size = <0x20000>' in block, "base node pmsg-size edit failed"
          assert 'status = "disabled"' not in block, "base node still disabled"
          assert REGION_SIZE - 0x40000 - 0 - 0x20000 >= 0x20000, "base node sizes leave no dump area"
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)
          print("msm8953.dtsi: base ramoops node fixed (record 0x20000, console 0x40000, pmsg 0x20000, enabled)")
          print("--- edited base node ---")
          print(block)
          # project node (sdm450-pmi632.dtsi): DELETE outright, never disable
          p = dts_dir / "sdm450-pmi632.dtsi"
          s = p.read_text()
          m = re.search(r'(?m)^[ \t]*pstore: ramoops@92100000\s*\{[^{}]*\};\r?\n', s)
          if not m:
              sys.exit("ERROR: pstore: ramoops@92100000 node not found in sdm450-pmi632.dtsi - tree changed, stop instead of building blind")
          s = s[:m.start()] + s[m.end():]
          assert "ramoops@92100000" not in s, "project node deletion failed"
          p.write_text(s)
          print("sdm450-pmi632.dtsi: project ramoops node DELETED (was second, never-probed area)")
          PY
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "=== git diff --stat (DT + defconfig) ==="
            git diff --stat | tail -5 || true
            echo "=== git diff: msm8953.dtsi + sdm450-pmi632.dtsi ==="
            git diff -- arch/arm64/boot/dts/qcom/msm8953.dtsi arch/arm64/boot/dts/qcom/sdm450-pmi632.dtsi || true
          fi
          echo "pstore-fix-v20: done"
          echo "After flashing: dmesg | grep -i ramoops   (expect 'ramoops: attached 0x100000@0x91400000')"
          SHEOF
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          bash /tmp/pstore-fix-v20.sh "$PSTORE_CHOICE"

      - name: Fetch backslashxx KernelSU driver (official setup.sh, pinned v3.3.1-38)
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s v3.3.1-38
          ls -la drivers/kernelsu
          test -L drivers/kernelsu || { echo "ERROR: drivers/kernelsu symlink missing after setup.sh" >&2; exit 1; }
          test -f drivers/kernelsu/feature/sucompat.c || { echo "ERROR: driver source not linked" >&2; exit 1; }
          echo "=== hook functions the kernel source calls (must all be present) ==="
          grep -q "ksu_handle_execveat" drivers/kernelsu/feature/sucompat.c || { echo "ERROR: ksu_handle_execveat missing from driver" >&2; exit 1; }
          grep -q "ksu_handle_faccessat" drivers/kernelsu/feature/sucompat.c || { echo "ERROR: ksu_handle_faccessat missing from driver" >&2; exit 1; }
          grep -q "ksu_handle_stat" drivers/kernelsu/feature/sucompat.c || { echo "ERROR: ksu_handle_stat missing from driver" >&2; exit 1; }
          grep -q "ksu_handle_sys_reboot" drivers/kernelsu/supercall/supercall.c || { echo "ERROR: ksu_handle_sys_reboot missing from driver" >&2; exit 1; }
          echo "=== driver must NOT have a CONFIG_KSU_MANUAL_HOOK option (guard is CONFIG_KSU) ==="
          if grep -q "KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig; then echo "ERROR: driver has KSU_MANUAL_HOOK - the hooks patch guard is wrong" >&2; exit 1; fi
          echo "backslashxx KernelSU v3.3.1-38 fetched and verified"

      - name: Install aarch64 toolchain (GCC 9.4, kernel.org crosstool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev zip
          mkdir -p toolchain
          cd toolchain
          curl -sSL -o gcc.tar.xz \
            https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/9.4.0/x86_64-gcc-9.4.0-nolibc-aarch64-linux.tar.xz
          tar -xf gcc.tar.xz
          ./gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc --version

      - name: Build kernel
        run: |
          export ARCH=arm64
          GCC_DIR=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin
          # No ccache in v23 (removed at the user's call): CROSS_COMPILE
          # points straight at the real toolchain, so every run compiles
          # the whole kernel from scratch. Slower, but no cache directory,
          # no third-party cache action, and no stale-cache doubt.
          export CROSS_COMPILE=$GCC_DIR/aarch64-linux-
          make RMX1805_ArcticFox-KSU_defconfig
          # v20 fail-fast #2: prove the built .config carries pstore BEFORE
          # the parallel build, so a config regression fails here loudly
          # instead of uploading a kernel that silently has no pstore.
          PSTORE_CHOICE2="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE2" ]; then PSTORE_CHOICE2="enabled"; fi
          if [ "$PSTORE_CHOICE2" = "enabled" ]; then
            grep "PSTORE" .config
            grep -q "^CONFIG_PSTORE=y$" .config || { echo "ERROR: PSTORE not y in .config after defconfig" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE_RAM=y$" .config || { echo "ERROR: PSTORE_RAM not y in .config after defconfig" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || { echo "ERROR: PSTORE_CONSOLE not y in .config after defconfig - pstore-fix did not reach defconfig" >&2; exit 1; }
            grep -q "^CONFIG_PSTORE_PMSG=y$" .config || { echo "ERROR: PSTORE_PMSG not y in .config after defconfig - pstore-fix did not reach defconfig" >&2; exit 1; }
          fi
          # Host-tool guard: see v18 header. Build host tools serially
          # first so parallel jobs do not race to rebuild fixdep, then
          # prove fixdep is executable before the parallel build starts.
          make ARCH=arm64 -j1 scripts
          chmod +x scripts/basic/fixdep
          ls -l scripts/basic/fixdep
          test -x scripts/basic/fixdep
          make -j$(nproc) LOCALVERSION= \
            KCFLAGS="-Idrivers/gpu/msm \
                     -Idrivers/bluetooth \
                     -Idrivers/input/touchscreen/ili9881_18663 \
                     -Idrivers/media/platform/msm/camera_v2/isp \
                     -Idrivers/media/platform/msm/camera_v2/common \
                     -Idrivers/media/platform/msm/camera_v2/sensor/io \
                     -Idrivers/qihoo \
                     -Idrivers/usb/gadget \
                     -Idrivers/platform/msm/ipa/ipa_v2 \
                     -Idrivers/platform/msm/ipa/ipa_clients"
          ls -lh arch/arm64/boot/Image arch/arm64/boot/Image.gz-dtb

      - name: Verify pstore in built .config
        run: |
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          echo "pstore choice: $PSTORE_CHOICE"
          grep "PSTORE" .config
          if [ "$PSTORE_CHOICE" = "enabled" ]; then
            grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          else
            ! grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          fi

      - name: Pack AnyKernel3 zip
        run: |
          # AnyKernel3 at 10a3586: last version with flash_dtbo() and
          # lowercase-var backwards compat (user's proven anykernel.sh)
          git clone --quiet https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          git checkout -q 10a35863de9b7715da84e4d6186155423a5415b9
          rm -rf .git .github
          cp ../arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ArcticFox KernelSU (backslashxx) Kernel for RMX1805/RMX1809/RMX1811
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RMX1805
          device.name2=RMX1809
          device.name3=RMX1811
          supported.versions=9 - 14.1
          '; } # end properties

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_block_display=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          # flash boot and dtbo (dtbo is skipped automatically if not bundled)
          flash_boot;
          flash_dtbo;
          ## end boot install
          AK3EOF
          cd ..
          # bundle kernel modules (stripped) for do.modules=1
          mkdir -p anykernel3/modules/system/lib/modules
          rm -f anykernel3/modules/system/lib/modules/placeholder
          for ko in $(find drivers net fs -name "*.ko"); do
            cp "$ko" anykernel3/modules/system/lib/modules/
          done
          STRIP=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-strip
          "$STRIP" --strip-unneeded anykernel3/modules/system/lib/modules/*.ko
          ls anykernel3/modules/system/lib/modules/
          cd anykernel3
          ls -lh Image.gz-dtb anykernel.sh
          ls modules/system/lib/modules/ | grep -E "wlan.ko"
          test -f Image.gz-dtb && test -f anykernel.sh && echo "AnyKernel3 payload verified"
          cd ..

      - name: Upload AnyKernel3 (directly flashable)
        uses: actions/upload-artifact@v4
        with:
          name: RMX1805-ArcticFox-KSU-backslashxx-Kernel-${{ github.sha }}
          # Upload the payload directly (not a pre-made zip): GitHub zips the
          # artifact once on download, so the downloaded file IS the flashable
          # AnyKernel3 zip. No more zip-inside-zip.
          path: anykernel3/*
          retention-days: 14
