# kernel-v17-bakasu-susfs230-inline (2026-11-09): v16 + in-mk diagnostics.
# The other LLM was right about one thing: my debug step instrumented the
# wrong context (a top-level shell step, not the sub-make where the gate
# runs). But its two specific guesses are WRONG for this tree -- verified
# against the real files: (1) top Makefile line 484 DOES export VERSION
# PATCHLEVEL, so they are visible in the sub-make; (2) KSU_SRC is assigned
# at BakaSU Kbuild line 63, well before susfs_compat.mk is included at
# line 192, so it is bound. This build puts $(info ...) diagnostics INSIDE
# susfs_compat.mk itself, right before the gate, so the real build prints
# the real bindings. Read the build log for the DEBUG lines -- the blank
# one names the failing condition. No other change. BakaSU 516d3e87, SUSFS
# 2.3.0 inline hook, NO MANUAL_HOOK, enforcing cmdline, pstore, low-RAM.
# v15's debug step produced NO output and died at once -- my bug: it never
# set ARCH=arm64, so `make defconfig` looked in arch/x86/configs/, failed,
# and bash -e killed the script before any echo ran. This build only adds
# `export ARCH=arm64` to the debug step. The gate itself is unchanged; the
# debug output will now actually print. BakaSU 516d3e87, SUSFS 2.3.0 inline
# hook, NO MANUAL_HOOK, enforcing cmdline, pstore, low-RAM. Manager: BakaSU.
# v14 FAILED at susfs_compat.mk:35 again, even though the build log shows
# the KALLSYMS_ALL .config fail-fast PASSED (so DEBUG_KERNEL was not the
# cause -- v14's theory was wrong). This build adds a debug step before the
# build that prints each of the 7 gate conditions separately, so the next
# log names the failing one. No other change. Do NOT build a v16 until the
# debug output is read. BakaSU 516d3e87, SUSFS 2.3.0 inline hook, NO
# MANUAL_HOOK, enforcing cmdline, pstore, low-RAM. Manager: BakaSU (spoofed).
# v13 FAILED TO BUILD (run 115442068352, step 13) at susfs_compat.mk:35 again,
# even though the marker was written. Root cause: susfs_compat.mk also
# requires CONFIG_KALLSYMS_ALL=y in .config, and KALLSYMS_ALL depends on
# DEBUG_KERNEL && KALLSYMS. The pristine defconfig has KALLSYMS_ALL=y but
# NO DEBUG_KERNEL, so `make defconfig` silently drops KALLSYMS_ALL and the
# gate fails. This build adds CONFIG_DEBUG_KERNEL=y + CONFIG_KALLSYMS=y to
# the defconfig (so KALLSYMS_ALL survives) and a .config fail-fast for it.
# Nothing else changed. BakaSU 516d3e87, SUSFS 2.3.0 inline hook, NO
# MANUAL_HOOK, enforcing cmdline, pstore, low-RAM. Manager: BakaSU (spoofed).
# v12 FAILED at step 9 (marker step): "KernelSU/kernel/.susfs-4.9-auto-reviewed:
# No such file or directory". My bug -- the workflow clones BakaSU into a dir
# named "BakaSU", not "KernelSU" (chorusfruit uses KernelSU; v11/v12 use
# BakaSU). The marker goes to BakaSU/kernel/.susfs-4.9-auto-reviewed, which
# is drivers/kernelsu/ via the symlink and what susfs_compat.mk checks
# ($(KSU_SRC)/.susfs-4.9-auto-reviewed). Nothing else changed.
# BakaSU 516d3e87, SUSFS 2.3.0 inline hook, NO MANUAL_HOOK, enforcing
# cmdline, pstore, low-RAM. Manager: BakaSU (spoofed).
# v11 FAILED TO BUILD (run 115438576819, step 12): susfs_compat.mk:35
# "BakaSU 4.9 automatic SELinux adaptation requires reviewed source
# preparation." Root cause: the bakasu-selinux patch adds a gate requiring
# KernelSU/kernel/.susfs-4.9-auto-reviewed to contain "lineage-4.9-auto-v1".
# Chorusfruit writes it in check-susfs-4.9.sh --prepare; v11 never created
# it. This build adds a step that verifies the prerequisites and writes the
# marker after all source prep. Everything else is identical to v11.
# BakaSU 516d3e87, SUSFS 2.3.0 inline hook, NO MANUAL_HOOK, enforcing
# cmdline, pstore, low-RAM. Manager: BakaSU (spoofed).
# INLINE HOOK method, from the chorusfruit OnePlus SDM845 project
# (github.com/chorusfruit-233/OnePlus_SDM845_BakaSU_SUSFS, proven on
# 4.9.337 -- same kernel version as RMX1805). This REPLACES the failed
# v36-v40 line, which forced MANUAL_HOOK + SUSFS together (mutually
# exclusive per the BakaSU guide, hence EDL). v11 uses NO MANUAL_HOOK:
# the BakaSU driver's Kconfig choice "KernelSU Hooking Method" is set to
# CONFIG_KSU_SUSFS=y ("SUSFS Inline Hook"), which deselects MANUAL_HOOK
# and TRACEPOINT_HOOK.
#
# Sources (all embedded as heredocs except the BakaSU driver, which is
# cloned and pinned; nothing is fetched from the chorusfruit repo):
# - BakaSU driver: github.com/Baka-SU/BakaSU, pinned commit
#   516d3e87fbc986ccefdde2c2765f1700612441a9 ("ksuinit: make lint check
#   happy"). This IS the commit chorusfruit reviewed (check-bakasu-4.9.py
#   passes locally: "reviewed 4.9 integration unchanged, patch base
#   c0c96a4087285ff82d71003d4186629de1c46b3c"). The pin itself is the
#   verification, so the checker is not re-run at build time.
# - Driver patches (chorusfruit, applied to the BakaSU clone):
#   bakasu-selinux-4.9.patch, 643 lines, md5 d49b636f12d8e62439c87a004517f4e2
#   bakasu-compat-4.9.patch, 217 lines, md5 74785fc4d5ec16d1b60048aa2c066811
#   bakasu-susfs-sync-4.9.patch, 64 lines, md5 8a69fae40e7e7436124828bfdb0641e7
#   (adds CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER; the other two are the
#   4.9 automatic SELinux hook + compat shims.)
# - Tree patch: v11-susfs230-rmx1805.patch, 4950 lines, 21 files,
#   md5 be7fea07dd7288a373923d77e414b278. The chorusfruit susfs-4.9.patch
#   (md5 da31c28b237e4fbbd3d14850d9ee7fee, 4940 lines) ported to RMX1805:
#   5 hunks re-anchored (namei.c, namespace.c, cmdline.c, stat.c,
#   task_mmu.c -- all generic-file context mismatches, no RMX1805 SoC
#   files). Two deliberate deviations: task_mmu.c show_map_vma uses
#   RMX1805's own seq_printf (OnePlus show_vma_header_prefix() does not
#   exist here); stat.c gains #include <linux/susfs_def.h> (needed for
#   susfs_is_current_app_uid / STATX_SUS_KSTAT). Verified: applies clean
#   to a fresh pristine tree (twice), SUSFS_VERSION v2.3.0.
# - Strip script: v11-strip-old-ksu-hooks.py, md5 ea8331ffd322a2bd3f5a8e0b83ae809b.
#   The pristine RMX1805 tree already carries BakaSU MANUAL-HOOK calls
#   committed in fs/exec.c, fs/open.c, fs/read_write.c, fs/stat.c and
#   drivers/input/input.c. Those reference symbols the inline-hook driver
#   does NOT define (ksu_handle_vfs_read, and the bool hooks
#   ksu_execveat_hook / ksu_vfs_read_hook / ksu_input_hook), so keeping
#   them breaks the link, and the inline-hook script skips any file
#   containing "ksu_handle". The strip removes exactly those 10 old
#   blocks (2 per file) and nothing else (SUSFS blocks are kept).
# - Inline-hook script: susfs-inline-hook.sh, 368 lines,
#   md5 587c41af9d3c33a401107a0f425f3105. Runs after the tree patch +
#   strip; aborts on any failed section. Verified locally: all 11 files
#   patched (exec.c, open.c, read_write.c, stat.c, namei.c static removal,
#   input.c, hooks.c, services.c, reboot.c, sys.c, seccomp.h).
# - ksu_sid fix: v11-ksud-bounded-fix.patch (v35's ksud-bounded-fix,
#   md5 386c2cf436b581150e833092a018e8a0). The pristine tree's
#   security/selinux/hooks.c resolves "u:r:su:s0" into ksu_sid (v34 bug);
#   ksud runs as u:r:ksu:s0, so without this ksud never starts. The
#   inline-hook script detects the block already exists and does not
#   re-add it, so this fix is still required.
# - Tree preinit/module patch: bakasu-preinit-module-4.9.patch, 104 lines,
#   md5 e1701c8440176becb49817e69ff19186. NOTE: this is a TREE patch
#   (fs/exec.c, kernel/module.c), applied after the inline-hook script
#   (it anchors on the script's exec.c additions). Verified locally.
# - Defconfig: CONFIG_KSU=y + CONFIG_KSU_SUSFS=y (inline-hook choice)
#   + SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME,
#   SPOOF_CMDLINE_OR_BOOTCONFIG, OPEN_REDIRECT, SUS_MAP, ENABLE_LOG,
#   HIDE_KSU_SUSFS_SYMBOLS, PRIORITY_UID_FILTER (all =y). NO
#   CONFIG_KSU_MANUAL_HOOK, NO CONFIG_KSU_TRACEPOINT_HOOK. NO
#   CONFIG_KSU_SUSFS_TRY_UMOUNT and NO CONFIG_KSU_SUSFS_SUS_MEMFD --
#   neither exists in this BakaSU/SUSFS version (TRY_UMOUNT is only
#   #defines in susfs.h; SUS_MEMFD is absent entirely). Verified locally:
#   make defconfig resolves all of them, MANUAL_HOOK and TRACEPOINT_HOOK
#   stay unset.
# - Low-RAM tweaks, pstore fix, GCC 9.4 toolchain, enforcing patch_cmdline
#   (androidboot.selinux=permissive -> enforcing, after split_boot) and
#   AnyKernel3 packing are reused verbatim from v35 (RMX1805-proven).
#   NO buildvariant patch. Manager: BakaSU manager (spoofed, ships with
#   BakaSU). Fallback if v11 does not boot: v3 (backslashxx + SUSFS,
#   proven) or v35 (sidex15 KSU-Next + SUSFS, proven).
#

name: Build RMX1805 Kernel (BakaSU + SUSFS inline-hook)

on:
  workflow_dispatch:
    inputs:
      pstore:
        description: 'Pstore (ramoops) logging'
        type: choice
        required: true
        default: 'enabled'
        options:
          - enabled
          - disabled
  push:
    branches:
      - ArcticFox
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Fetch BakaSU driver (pinned 516d3e87) + 3 chorusfruit patches
        run: |
          # BakaSU driver, pinned to the commit chorusfruit reviewed
          # (check-bakasu-4.9.py passes locally on this exact commit).
          # Do NOT use setup.sh (it would clone upstream main).
          git clone --quiet https://github.com/Baka-SU/BakaSU.git BakaSU
          cd BakaSU
          git checkout -q 516d3e87fbc986ccefdde2c2765f1700612441a9
          test "$(git rev-parse HEAD)" = "516d3e87fbc986ccefdde2c2765f1700612441a9" || { echo "ERROR: BakaSU HEAD is not the pinned commit" >&2; exit 1; }
          git log --oneline -1
          cd ..
          # --- driver patches (chorusfruit, embedded) ---
          cat > /tmp/bakasu-selinux-4.9.patch <<'SELINUXEOF'
          # BakaSU Linux 4.9 adaptation.
          # Base: c0c96a4087285ff82d71003d4186629de1c46b3c.
          # Applies to the reviewed Lineage ARM64 SUSFS inline/automatic SELinux port.

          diff --git a/kernel/feature/selinux_hide.c b/kernel/feature/selinux_hide.c
          index 91b54ef..79e32a0 100644
          --- a/kernel/feature/selinux_hide.c
          +++ b/kernel/feature/selinux_hide.c
          @@ -56,6 +56,8 @@ static DEFINE_MUTEX(selinux_hide_mutex);
           __maybe_static bool ksu_selinux_hide_enabled __read_mostly = false;
           // remove static in susfs
           __maybe_static bool ksu_selinux_hide_running __read_mostly = false;
          +/* A failed restore can leave callbacks using the backup policy. */
          +static bool ksu_selinux_hide_cleanup_pending;
           
           #ifdef KSU_COMPAT_USE_STATIC_KEY
           // We should talk to you, susfs
          @@ -118,55 +120,17 @@ static __nocfi void ksu_security_compute_av_user(struct policydb *policydb, stru
                                                           struct context *tcontext, u16 tclass, struct av_decision *avd,
                                                           struct extended_perms *xperms) = NULL;
           #else
          -    // mostly 4.14-
          -    struct sidtab* sidtab_ptr;
          +    struct sidtab *sidtab_ptr;
           
          -    // compat wrapper
          -    static void (*legacy_security_dump_masked_av_fn)(struct context *scontext, struct context *tcontext,
          -                                            u16 tclass, u32 permissions, const char *reason) = NULL;
          -    #if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 3, 0) || defined(KSU_COMPAT_HAS_EXTENDED_PERMS)
          -        // extended_perms add in 4.3
          -        static void (*legacy_context_struct_compute_av_fn)(struct context *scontext,
          -                                                    struct context *tcontext, u16 tclass, struct av_decision *avd,
          -                                                    struct extended_perms *xperms) = NULL;
          -
          -        static void ksu_context_struct_compute_av_fn(struct policydb *policydb, struct context *scontext,
          -                                                    struct context *tcontext, u16 tclass, struct av_decision *avd,
          -                                                    struct extended_perms *xperms)
          -        {
          -            if (legacy_context_struct_compute_av_fn) {
          -                legacy_context_struct_compute_av_fn(scontext, tcontext, tclass, avd, xperms);
          -            }
          -        }
          -    #else
          -        struct extended_perms {
          -            /* I am a placeholder, I just want to make the compiler happy */   
          -        }
          -        static void (*legacy_context_struct_compute_av_fn)(struct context *scontext,
          -                                                    struct context *tcontext, u16 tclass, struct av_decision *avd) = NULL;
          -
          -        static void ksu_context_struct_compute_av_fn(struct policydb *policydb, struct context *scontext,
          -                                                    struct context *tcontext, u16 tclass, struct av_decision *avd,
          -                                                    struct extended_perms *xperms)
          -        {
          -            if (legacy_security_dump_masked_av_fn) {
          -                legacy_security_dump_masked_av_fn(scontext, tcontext, tclass, avd);
          -            }
          -        }
          -    #endif
          -    static void ksu_security_dump_masked_av(struct policydb *policydb, struct context *scontext, struct context *tcontext,
          -                                            u16 tclass, u32 permissions, const char *reason)
          -    {
          -        if (legacy_security_dump_masked_av_fn) {
          -            legacy_security_dump_masked_av_fn(scontext, tcontext, tclass, permissions, reason);
          -        }
          -    }
          -
          -    static void (*security_dump_masked_av_fn)(struct policydb *policydb, struct context *scontext, struct context *tcontext,
          -                                            u16 tclass, u32 permissions, const char *reason) = ksu_security_dump_masked_av;
          +    /* The legacy helpers use the live global policydb. Backup decisions
          +     * must use the policy-aware fallback; its optional audit dump is omitted.
          +     */
          +    static void (*security_dump_masked_av_fn)(struct policydb *policydb, struct context *scontext,
          +                                            struct context *tcontext, u16 tclass, u32 permissions,
          +                                            const char *reason) = NULL;
               static void (*context_struct_compute_av_fn)(struct policydb *policydb, struct context *scontext,
                                                           struct context *tcontext, u16 tclass, struct av_decision *avd,
          -                                                struct extended_perms *xperms) = ksu_context_struct_compute_av_fn;
          +                                                struct extended_perms *xperms) = NULL;
           #endif
           // clang-format on
           
          @@ -462,6 +426,11 @@ int __nocfi ksu_handle_selinux_setprocattr(const char *name, void *value, size_t
           int __nocfi ksu_handle_selinux_setprocattr(struct task_struct *p, char *name, void *value, size_t size)
           #endif
           {
          +#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 11, 0) && !defined(KSU_COMPAT_SETPROCATTR_USE_NEW_PROTOTYPE)
          +    /* Preserve the legacy SELinux check before inspecting the requested attr. */
          +    if (current != p)
          +        return -EACCES;
          +#endif
           #ifndef KSU_COMPAT_HAS_SUSFS_FEATURE_SELINUX_HIDE
               if (likely(ksu_get_uid_t(current_uid()) < 10000)) {
                   goto call_orig;
          @@ -590,10 +559,10 @@ static int my_sel_open_handle_status(struct inode *inode, struct file *filp)
               return ret;
           }
           
          -static void hook_selinux_status_open()
          +static int hook_selinux_status_open()
           {
               if (orig_sel_open_handle_status)
          -        return;
          +        return 0;
               if (!sel_open_handle_status_slot) {
           #ifdef CONFIG_KALLSYMS_ALL
                   struct file_operations *ops = (struct file_operations *)find_kernel_symbol_exact("sel_handle_status_ops");
          @@ -603,7 +572,7 @@ static void hook_selinux_status_open()
           #endif
                   if (!ops) {
                       pr_err("selinux_hide: sel_handle_status_ops not found, fake status will not work\n");
          -            return;
          +            return -ENOENT;
                   }
                   sel_open_handle_status_slot = &ops->open;
               }
          @@ -615,26 +584,32 @@ static void hook_selinux_status_open()
                   sel_open_handle_status_slot = NULL;
                   orig_sel_open_handle_status = NULL;
               }
          +    return ret;
           }
           
           extern void ksu_unregister_setprocattr_lsm_hook();
           
          -static void ksu_selinux_hide_unhook()
          +static int ksu_selinux_hide_unhook()
           {
          -    int ret;
          +    int ret, error = 0;
               if (orig_context_write) {
                   ret =
                       ksu_patch_text(context_write, &orig_context_write, sizeof(orig_context_write), KSU_PATCH_TEXT_FLUSH_DCACHE);
          -        orig_context_write = NULL;
                   if (ret) {
                       pr_err("selinux_hide: exit: patch_text context_write err: %d\n", ret);
          +            error = ret;
          +        } else {
          +            orig_context_write = NULL;
                   }
               }
               if (orig_access_write) {
                   ret = ksu_patch_text(access_write, &orig_access_write, sizeof(orig_access_write), KSU_PATCH_TEXT_FLUSH_DCACHE);
          -        orig_access_write = NULL;
                   if (ret) {
                       pr_err("selinux_hide: exit: patch_text access_write err: %d\n", ret);
          +            if (!error)
          +                error = ret;
          +        } else {
          +            orig_access_write = NULL;
                   }
               }
           #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
          @@ -643,21 +618,28 @@ static void ksu_selinux_hide_unhook()
               if (ksu_orig_setprocattr) {
                   ret = ksu_patch_text((void *)selinux_setprocattr_hook_ptr, &ksu_orig_setprocattr, sizeof(ksu_orig_setprocattr),
                                        KSU_PATCH_TEXT_FLUSH_DCACHE);
          -        ksu_orig_setprocattr = NULL;
                   if (ret) {
                       pr_err("selinux_hide: exit: patch_text setprocattr err: %d\n", ret);
          +            if (!error)
          +                error = ret;
          +        } else {
          +            ksu_orig_setprocattr = NULL;
          +            selinux_setprocattr_hook_ptr = 0;
                   }
               }
           #else
               stop_machine(ksu_unregister_setprocattr_lsm_hook, NULL, NULL);
           #endif
          +    ksu_selinux_hide_cleanup_pending = error != 0;
          +    return error;
           }
           
           extern void ksu_register_setprocattr_lsm_hook();
           #else
          -#define ksu_selinux_hide_unhook()                                                                                      \
          -    do {                                                                                                               \
          -    } while (0)
          +static inline int ksu_selinux_hide_unhook(void)
          +{
          +    return 0;
          +}
           #endif // #ifndef KSU_COMPAT_HAS_SUSFS_FEATURE_SELINUX_HIDE
           
           static int ksu_selinux_hide_enable()
          @@ -682,7 +664,13 @@ static int ksu_selinux_hide_enable()
           #endif
           
           #ifndef KSU_COMPAT_HAS_SUSFS_FEATURE_SELINUX_HIDE
          -    hook_selinux_status_open();
          +    if (!fake_status || !ksu_selinux_status_lock) {
          +        pr_err("selinux_hide: status snapshot is not available\n");
          +        return -EAGAIN;
          +    }
          +    ret = hook_selinux_status_open();
          +    if (ret)
          +        return ret;
           #endif
           
               // clang-format off
          @@ -696,22 +684,13 @@ static int ksu_selinux_hide_enable()
                   if (!context_struct_compute_av_fn) {
                       pr_warn("context_struct_compute_av not found!\n");
                   }
          -    #else
          -        legacy_security_dump_masked_av_fn = ksu_resolve_symbol_for_functable_hook("security_dump_masked_av");
          -        if (!legacy_security_dump_masked_av_fn) {
          -            pr_warn("security_dump_masked_av not found!\n");
          -        }
          -        legacy_context_struct_compute_av_fn = ksu_resolve_symbol_for_functable_hook("context_struct_compute_av");
          -        if (!legacy_context_struct_compute_av_fn) {
          -            pr_warn("context_struct_compute_av not found!\n");
          -        }
               #endif
           
               #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0) && !defined(KSU_COMPAT_USE_SELINUX_STATE)
                   sidtab_ptr = ksu_resolve_symbol_for_functable_hook("sidtab");
                   if (!sidtab_ptr) {
                       pr_err("sidtab can not find!");
          -            return -EFAULT;
          +            goto unhook;
                   }
               #endif
           #else
          @@ -731,27 +710,6 @@ static int ksu_selinux_hide_enable()
                   if (!context_struct_compute_av_fn) {
                       pr_warn("context_struct_compute_av not found!\n");
                   }
          -    #else
          -        extern void security_dump_masked_av(struct context *scontext, struct context *tcontext,
          -                                                        u16 tclass, u32 permissions, const char *reason);
          -        #if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 3, 0) || defined(KSU_COMPAT_HAS_EXTENDED_PERMS)
          -        extern void context_struct_compute_av(struct context *scontext,
          -                                                struct context *tcontext, u16 tclass, struct av_decision *avd,
          -                                                struct extended_perms *xperms);
          -        #else
          -        extern void context_struct_compute_av(struct context *scontext, 
          -                                                struct context *tcontext, u16 tclass, struct av_decision *avd);
          -        #endif
          -
          -        legacy_security_dump_masked_av_fn = &security_dump_masked_av;
          -        if (!legacy_security_dump_masked_av_fn) {
          -            pr_warn("security_dump_masked_av not found!\n");
          -        }
          -
          -        legacy_context_struct_compute_av_fn = &context_struct_compute_av;
          -        if (!legacy_context_struct_compute_av_fn) {
          -            pr_warn("context_struct_compute_av not found!\n");
          -        }
               #endif
           
               #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0) && !defined(KSU_COMPAT_USE_SELINUX_STATE)
          @@ -772,7 +730,7 @@ static int ksu_selinux_hide_enable()
           #endif
               if (!selinux_write_op) {
                   pr_err("selinux_hide: no write_op found!\n");
          -        return -ENOSYS;
          +        goto unhook;
               }
           
               context_write = &selinux_write_op[SEL_CONTEXT];
          @@ -803,6 +761,13 @@ static int ksu_selinux_hide_enable()
               }
           #elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 2, 0) || defined(KSU_COMPAT_HAS_LIST_OF_LSM_HOOKS)
               struct security_hook_list *hp;
          +#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 11, 0) && !defined(KSU_COMPAT_REQUIRE_PROVIDE_LSM_NAME)
          +    void *selinux_setprocattr = ksu_resolve_symbol_for_functable_hook("selinux_setprocattr");
          +    if (!selinux_setprocattr) {
          +        pr_err("selinux_hide: selinux_setprocattr not found\n");
          +        goto unhook;
          +    }
          +#endif
           
               // https://github.com/torvalds/linux/commit/df0ce17331e2501dbffc060041dfc6c5f85227b5
           #if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 17, 0) || defined(KSU_COMPAT_HLIST_FOR_SECURITY_HOOK_LIST)
          @@ -818,6 +783,9 @@ static int ksu_selinux_hide_enable()
                   // when we are in 4.11+, we can ensure we are control "selinux" LSM by that
                   if (strcmp("selinux", hp->lsm))
