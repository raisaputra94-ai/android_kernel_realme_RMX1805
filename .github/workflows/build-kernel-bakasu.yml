          #!/usr/bin/env bash
          #
          # pstore-fix.sh - make pstore/ramoops work on the RMX1805 (ArcticFox) kernel.
          #
          # Run it from the kernel source root, BEFORE "make <defconfig>".
          #
          #   ./pstore-fix.sh                      # enabled, project node (default)
          #   ./pstore-fix.sh enabled --region base
          #   ./pstore-fix.sh disabled             # turn pstore off completely
          #
          # What it changes
          #   defconfig  PSTORE, PSTORE_RAM, PSTORE_CONSOLE, PSTORE_PMSG = y
          #              PSTORE_FTRACE = not set (the old "#CONFIG_..=n" comment
          #              lines are removed, they are not real config lines)
          #   device tree (enabled mode only), two ramoops nodes exist:
          #     base     msm8953.dtsi       ramoops@0x91400000
          #              record-size = <0x0 0x00020000> has TWO cells, the driver
          #              reads only the first one (0), so the probe fails with
          #              "The memory size and the record/console size must be non-zero".
          #     project  sdm450-pmi632.dtsi pstore: ramoops@92100000 (vendor design)
          #
          #   --region project (default): disable the base node, resize the project
          #            node (console 0x40000, record 0x20000, pmsg 0x20000).
          #   --region base: fix the base node (single-cell sizes + console/pmsg)
          #            and leave the project node alone. Use this if, after flashing,
          #            dmesg shows no "ramoops: attached" line (project node not in
          #            the DTB your phone boots).
          #
          # The driver (fs/pstore/ram.c) allows only ONE ramoops area; the first
          # node that probes successfully wins. Dump area = region - console -
          # ftrace - pmsg (the record size is NOT subtracted); it must hold at least
          # one record. New project node: 0x100000 - 0x40000 - 0x20000 = 0xA0000 =
          # 5 records.
          #
          # Not compiled or boot-tested. The region being free on your bootloader's
          # memory map is an assumption. Keep the previous kernel zip.
          #
          # Safe to run twice. Exits non-zero if an expected line or node is missing.

          set -euo pipefail

          MODE="enabled"
          REGION="project"
          DEFCONFIG="arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig"
          DTS_DIR="arch/arm64/boot/dts/qcom"

          usage() { sed -n '3,12p' "$0" | sed 's/^# \{0,1\}//'; exit "${1:-0}"; }

          while [ $# -gt 0 ]; do
            case "$1" in
              enabled|disabled) MODE="$1" ;;
              --region)    REGION="${2:-}"; shift ;;
              --defconfig) DEFCONFIG="${2:-}"; shift ;;
              --dts-dir)   DTS_DIR="${2:-}"; shift ;;
              -h|--help)   usage 0 ;;
              *) echo "unknown argument: $1" >&2; usage 1 ;;
            esac
            shift
          done

          case "$REGION" in project|base) ;; *) echo "ERROR: --region must be project or base" >&2; exit 1 ;; esac
          [ -f "$DEFCONFIG" ] || { echo "ERROR: defconfig not found: $DEFCONFIG (run from the kernel source root)" >&2; exit 1; }

          echo "pstore-fix: mode=$MODE region=$REGION"

          # ---------------------------------------------------------------- defconfig
          # set_cfg SYMBOL y|unset : write one clean line for SYMBOL. An existing line
          # (set, "is not set", or the non-standard "#CONFIG_X=n" comment) is replaced
          # in place, so line numbers do not move; extra duplicates are dropped. If
          # there is no such line, a new one is appended.
          set_cfg() {
            local sym="$1" val="$2" line tmp
            if [ "$val" = "y" ]; then line="CONFIG_${sym}=y"; else line="# CONFIG_${sym} is not set"; fi
            if grep -Eq "^(# *)?CONFIG_${sym}(=| is not set)" "$DEFCONFIG"; then
              tmp="$(mktemp)"
              awk -v pat="^(# *)?CONFIG_${sym}(=| is not set)" -v new="$line" \
                '$0 ~ pat { if (!done) { print new; done = 1 } ; next } { print }' "$DEFCONFIG" > "$tmp"
              cat "$tmp" > "$DEFCONFIG"
              rm -f "$tmp"
            else
              printf '%s\n' "$line" >> "$DEFCONFIG"
            fi
          }

          # make sure the file ends with a newline before appending
          [ -z "$(tail -c1 "$DEFCONFIG")" ] || printf '\n' >> "$DEFCONFIG"

          if [ "$MODE" = "enabled" ]; then
            set_cfg PSTORE y
            set_cfg PSTORE_RAM y
            set_cfg PSTORE_CONSOLE y
            set_cfg PSTORE_PMSG y
            set_cfg PSTORE_FTRACE unset
          else
            set_cfg PSTORE unset
            set_cfg PSTORE_RAM unset
            set_cfg PSTORE_CONSOLE unset
            set_cfg PSTORE_PMSG unset
            set_cfg PSTORE_FTRACE unset
          fi

          echo "=== pstore lines in $DEFCONFIG ==="
          grep -n "PSTORE" "$DEFCONFIG"

          check() { grep -q -- "$1" "$DEFCONFIG" || { echo "ERROR: expected '$1' in $DEFCONFIG" >&2; exit 1; }; }
          if [ "$MODE" = "enabled" ]; then
            check '^CONFIG_PSTORE=y$'
            check '^CONFIG_PSTORE_RAM=y$'
            check '^CONFIG_PSTORE_CONSOLE=y$'
            check '^CONFIG_PSTORE_PMSG=y$'
          fi

          if [ "$MODE" = "disabled" ]; then
            echo "pstore-fix: done (pstore disabled, device tree untouched)"
            exit 0
          fi

          # ------------------------------------------------------------- device tree
          command -v python3 >/dev/null || { echo "ERROR: python3 not found" >&2; exit 1; }

          python3 - "$DTS_DIR" "$REGION" <<'PY'
          import re, sys, pathlib

          dts_dir, region = pathlib.Path(sys.argv[1]), sys.argv[2]
          REGION_SIZE = 0x100000

          def read(p):
              # newline='' keeps CRLF files as they are
              with open(p, newline='') as f:
                  return f.read()

          def write(p, s):
              with open(p, 'w', newline='') as f:
                  f.write(s)

          def nl_of(s):
              return "\r\n" if "\r\n" in s else "\n"

          def dump_area(console, ftrace, pmsg):
              # fs/pstore/ram.c: dump_mem_sz = size - console - ftrace - pmsg
              return REGION_SIZE - console - ftrace - pmsg

          # ---- base node (msm8953.dtsi) -------------------------------------------
          p = dts_dir / "msm8953.dtsi"
          s = read(p)
          nl = nl_of(s)
          m = re.search(r'ramoops@0x91400000\s*\{[^{}]*\};', s)
          if not m:
              sys.exit("ERROR: ramoops@0x91400000 node not found in msm8953.dtsi")
          block = m.group(0)
          indent = re.search(r'\n([ \t]*)compatible', block)
          ind = indent.group(1) if indent else "\t\t\t"

          if region == "project":
              # disable the broken base node
              if 'status = "disabled"' not in block:
                  block = re.sub(r'(compatible\s*=\s*"ramoops";)',
                                 lambda mm: mm.group(1) + nl + ind + 'status = "disabled";',
                                 block, count=1)
              print("msm8953.dtsi: base ramoops node disabled")
          else:
              # fix the base node: single-cell sizes, add console + pmsg
              block = re.sub(r'[ \t]*status\s*=\s*"disabled";\r?\n', '', block)
              for prop in ("record-size", "console-size", "pmsg-size", "ftrace-size"):
                  block = re.sub(r'[ \t]*' + prop + r'\s*=\s*<[^>]*>;\r?\n', '', block)
              add = nl.join([ind + "record-size = <0x20000>;",
                             ind + "console-size = <0x40000>;",
                             ind + "pmsg-size = <0x20000>;"]) + nl
              block = re.sub(r'(compatible\s*=\s*"ramoops";\r?\n(?:[ \t]*reg\s*=\s*<[^>]*>;\r?\n)?)',
                             lambda mm: mm.group(1) + add, block, count=1)
              assert 'console-size' in block and 'record-size = <0x20000>' in block, "base node edit failed"
              assert dump_area(0x40000, 0, 0x20000) >= 0x20000, "base node sizes leave no dump area"
              print("msm8953.dtsi: base ramoops node fixed (record 0x20000, console 0x40000, pmsg 0x20000)")
          s = s[:m.start()] + block + s[m.end():]
          write(p, s)

          # ---- project node (sdm450-pmi632.dtsi) ----------------------------------
          if region == "project":
              p = dts_dir / "sdm450-pmi632.dtsi"
              s = read(p)
              nl = nl_of(s)
              m = re.search(r'(?m)^([ \t]*)pstore: ramoops@92100000\s*\{[^{}]*\};', s)
              if not m:
                  sys.exit("ERROR: pstore: ramoops@92100000 node not found in sdm450-pmi632.dtsi")
              ind = m.group(1)
              new = nl.join([
                  ind + "pstore: ramoops@92100000 {",
                  ind + "\tcompatible = \"ramoops\";",
                  ind + "\treg = <0 0x92100000 0 0x100000>;",
                  ind + "\tecc-size\t= <0x10>;",
                  ind + "\tconsole-size\t= <0x40000>;",
                  ind + "\trecord-size\t= <0x20000>;",
                  ind + "\tpmsg-size\t= <0x20000>;",
                  ind + "};",
              ])
              assert dump_area(0x40000, 0, 0x20000) >= 0x20000, "project node sizes leave no dump area"
              s = s[:m.start()] + new + s[m.end():]
              write(p, s)
              print("sdm450-pmi632.dtsi: project pstore node resized "
                    "(console 0x40000, record 0x20000, pmsg 0x20000, dump area 0xA0000 = 5 records)")
          PY

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "=== git diff --stat ==="
            git diff --stat | tail -5 || true
          fi
          echo "pstore-fix: done"
          echo "After flashing: dmesg | grep -i ramoops   (expect 'ramoops: attached ...')"
          echo "If there is no 'attached' line, rebuild with:  ./pstore-fix.sh enabled --region base"
          SHEOF
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          PSTORE_REGION="${{ inputs.pstore_region }}"
          if [ -z "$PSTORE_REGION" ]; then PSTORE_REGION="project"; fi
          bash /tmp/pstore-fix.sh "$PSTORE_CHOICE" --region "$PSTORE_REGION"

      - name: Fetch BakaSU driver (official setup.sh)
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s --
          ls -la drivers/kernelsu

      - name: Install aarch64 toolchain (GCC 9.4, kernel.org crosstool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev ccache zip
          mkdir -p toolchain
          cd toolchain
          curl -sSL -o gcc.tar.xz \
            https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/9.4.0/x86_64-gcc-9.4.0-nolibc-aarch64-linux.tar.xz
          tar -xf gcc.tar.xz
          ./gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc --version

      - name: ccache setup
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rmx1805-kernel-${{ github.ref_name }}
          max-size: 2G

      - name: Build kernel
        run: |
          export ARCH=arm64
          GCC_DIR=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin
          # Wrapper scripts for every cross tool. Only gcc goes through
          # ccache; the rest exec the real binary directly. This keeps CC
          # a single word, because kernel scripts (e.g. the stack-protector
          # check) pass $(CC) as a single $1, and "CC=ccache <compiler>"
          # breaks them. It also satisfies $(CROSS_COMPILE)ld/nm/objdump/...
          mkdir -p $GITHUB_WORKSPACE/ccache-bin
          for tool in "$GCC_DIR"/aarch64-linux-*; do
            name=$(basename "$tool")
            if [ "$name" = "aarch64-linux-gcc" ]; then
              printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$tool" > "$GITHUB_WORKSPACE/ccache-bin/$name"
            else
              printf '#!/bin/sh\nexec "%s" "$@"\n' "$tool" > "$GITHUB_WORKSPACE/ccache-bin/$name"
            fi
            chmod +x "$GITHUB_WORKSPACE/ccache-bin/$name"
          done
          export CROSS_COMPILE=$GITHUB_WORKSPACE/ccache-bin/aarch64-linux-
          make RMX1805_ArcticFox-KSU_defconfig
          # Host-tool guard: see v18 header. Build host tools serially
          # first so parallel jobs do not race to rebuild fixdep, then
          # prove fixdep is executable before the parallel build starts.
          make ARCH=arm64 -j1 scripts
          chmod +x scripts/basic/fixdep
          ls -l scripts/basic/fixdep
          test -x scripts/basic/fixdep
          make -j$(nproc) LOCALVERSION= \
            KCFLAGS="-Idrivers/gpu/msm \
                     -Idrivers/bluetooth \
                     -Idrivers/input/touchscreen/ili9881_18663 \
                     -Idrivers/media/platform/msm/camera_v2/isp \
                     -Idrivers/media/platform/msm/camera_v2/common \
                     -Idrivers/media/platform/msm/camera_v2/sensor/io \
                     -Idrivers/qihoo \
                     -Idrivers/usb/gadget \
                     -Idrivers/platform/msm/ipa/ipa_v2 \
                     -Idrivers/platform/msm/ipa/ipa_clients"
          ls -lh arch/arm64/boot/Image arch/arm64/boot/Image.gz-dtb

      - name: Verify pstore in built .config
        run: |
          PSTORE_CHOICE="${{ inputs.pstore }}"
          if [ -z "$PSTORE_CHOICE" ]; then PSTORE_CHOICE="enabled"; fi
          echo "pstore choice: $PSTORE_CHOICE"
          grep "PSTORE" .config
          if [ "$PSTORE_CHOICE" = "enabled" ]; then
            grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_CONSOLE=y$" .config || exit 1
            grep -q "^CONFIG_PSTORE_PMSG=y$" .config || exit 1
          else
            ! grep -q "^CONFIG_PSTORE=y$" .config || exit 1
            ! grep -q "^CONFIG_PSTORE_RAM=y$" .config || exit 1
          fi

      - name: Pack AnyKernel3 zip
        run: |
          # AnyKernel3 at 10a3586: last version with flash_dtbo() and
          # lowercase-var backwards compat (user's proven anykernel.sh)
          git clone --quiet https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          git checkout -q 10a35863de9b7715da84e4d6186155423a5415b9
          rm -rf .git .github
          cp ../arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ArcticFox BakaSU Kernel for RMX1805/RMX1809/RMX1811
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RMX1805
          device.name2=RMX1809
          device.name3=RMX1811
          supported.versions=9 - 14.1
          '; } # end properties

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_block_display=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          # flash boot and dtbo (dtbo is skipped automatically if not bundled)
          flash_boot;
          flash_dtbo;
          ## end boot install
          AK3EOF
          cd ..
          # bundle kernel modules (stripped) for do.modules=1
          mkdir -p anykernel3/modules/system/lib/modules
          rm -f anykernel3/modules/system/lib/modules/placeholder
          for ko in $(find drivers net fs -name "*.ko"); do
            cp "$ko" anykernel3/modules/system/lib/modules/
          done
          STRIP=$GITHUB_WORKSPACE/toolchain/gcc-9.4.0-nolibc/aarch64-linux/bin/aarch64-linux-strip
          "$STRIP" --strip-unneeded anykernel3/modules/system/lib/modules/*.ko
          ls anykernel3/modules/system/lib/modules/
          cd anykernel3
          ls -lh Image.gz-dtb anykernel.sh
          ls modules/system/lib/modules/ | grep -E "wlan.ko"
          test -f Image.gz-dtb && test -f anykernel.sh && echo "AnyKernel3 payload verified"
          cd ..

      - name: Upload AnyKernel3 (directly flashable)
        uses: actions/upload-artifact@v4
        with:
          name: RMX1805-ArcticFox-BakaSU-Kernel-${{ github.sha }}
          # Upload the payload directly (not a pre-made zip): GitHub zips the
          # artifact once on download, so the downloaded file IS the flashable
          # AnyKernel3 zip. No more zip-inside-zip.
          path: anykernel3/*
          retention-days: 14
