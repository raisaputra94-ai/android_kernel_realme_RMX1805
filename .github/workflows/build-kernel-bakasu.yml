          +void susfs_sus_kstat_spoof_show_map_vma(struct inode *inode, dev_t *out_dev, unsigned long *out_ino) {
          +	struct st_susfs_sus_kstat_hlist *entry = NULL;
          +	struct fuse_inode *fi = NULL;
          +	unsigned long target_ino = 0;
          +	dev_t target_dev = 0;
