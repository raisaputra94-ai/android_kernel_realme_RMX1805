# v24-dt2w-combined-nocache (2026-10-29): v23 verbatim
# MINUS nothing, PLUS exactly one change: the DT2W step now embeds the
# user's uploaded dt2w-rmx1805-combined.patch (md5 7610046f8ab75abffabd6e41d562e6e9)
# instead of ili9881_dt2w_light_true.patch. That uploaded patch = Light
# driver changes (finger_report/platform/userspace, 12 lines) + ONE extra
# DTS line: regulator-always-on in the iovdd_gpio_vreg node of
# arch/arm64/boot/dts/qcom/msm8953-mtp.dtsi. It contains NO config.c /
# default-on change, so proc still boots at 0 and the original module or
# manual echo is still needed to enable. This is NOT the set-aside
# ili9881_dt2w_combined_v2.patch (Light + default-on) from 2026-10-29
# 13:00 SGT, which must not be used. No-cache v23 base is untouched:
# no ccache step, package, or wrapper anywhere. Caveat carried over
# from the v23 check: the DTS hunk is in the sdm450-pmi632-mtp-s3 DTB
# chain but not the plain sdm450-pmi632 chain, and which DTB the
# bootloader picks on current builds is unproven, so the DTS line is
# not guaranteed to reach the booted DTB. User confirmed building this version 2026-10-29 13:09 SGT; v23 remains on disk untouched.
#
# v23-dt2w-light-nocache (2026-10-29): v22 verbatim MINUS ccache.
# The user said they do not need cache anymore in this workflow, and
# they are right: ccache was purely a speed optimisation, never a
# correctness requirement. Everything else is carried over from v22
# untouched: pstore base fix, BakaSU hooks, fixdep guard, 2GB low-RAM
# tweaks, DT2W Light patch (exact, no default-on), toolchain, AnyKernel3
# packing, and the pstore input (default enabled).
#
# WHAT WAS REMOVED, ALL THREE PIECES (removing only one would leave a
# half-cache behind, so all three go together):
#   1. The "ccache setup" step (hendrikmuhs/ccache-action@v1.2, key
#      rmx1805-kernel-<branch>, max-size 2G) - the step that restored
#      and saved the cache directory across runs.
#   2. The ccache package from the apt install line in the toolchain
#      step (bc bison flex libssl-dev zip remain).
#   3. The ccache-bin wrapper loop in "Build kernel" (only gcc went
#      through ccache; the rest exec'd the real binary). CROSS_COMPILE
#      now points straight at the real toolchain directory.
# TRADE-OFF, STATED PLAINLY: every GitHub run now compiles the full
# kernel from scratch, so runs will take longer than the cached runs
# did (v18's 8m4s run benefited from cache). In return there is no
# 2 GB cache to store, no third-party cache action in the flow, and no
# cache-related doubt about whether a build is fresh. If the slower
# runs ever hurt, v22 (with cache) is still on disk untouched and can
# be pushed again instead - no work is lost by this removal.
#
# v22-dt2w-light (2026-10-29): v20 verbatim + ONE new step, "Apply DT2W
# Light patch (ILI9881, exact)", inserted immediately before "Build kernel".
# Nothing else changed: pstore base fix, BakaSU hooks, fixdep guard, 2GB
# low-RAM tweaks, toolchain/ccache, AnyKernel3 packing, and the pstore
# input (default enabled) are all carried over from v20 untouched.
#
# WHAT THE DT2W STEP DOES (driver source only, no defconfig change):
#   Applies ili9881_dt2w_light_true.patch to the checked-out tree, then
#   fails fast if any marker is missing, BEFORE the parallel build starts.
#   This patch is EXACTLY the user's own June 2026 patches, with NO
#   assistant enhancement, NO combined default-on change, NO other edit:
#   - finger_report.c: gesture report key KEY_F4 -> KEY_WAKEUP (143,
#     System Wake Up) + set_bit(KEY_WAKEUP). F4 is ignored by Lineage;
#     WAKEUP is the key Android wakes on, with no power-menu side
#     effects. The KEY_POWER report stays inside its disabled #if 0
#     block, unchanged.
#   - platform.c: fb notifier handles FB_EVENT_BLANK as well as
#     FB_EARLY_EVENT_BLANK; the IRQ-disable on suspend is now conditional
#     on gesture being off; enable_irq_wake() re-added after ESD reset.
#   - userspace.c: ilitek_proc_gesture_write "on" also sets g_gesture=1
#     and "off" also sets g_gesture=0, keeping g_gesture in sync with
#     isEnableGesture on the /proc/ilitek/gesture path the original
#     Magisk module uses. The oppo proc path already set g_gesture.
#   - config.c: UNTOUCHED. The step fails fast if config.c shows any
#     default-on change, so this build cannot silently become the
#     combined version. The DT2W default stays OFF at boot.
#   The user's dt2w-irq-fix.patch is NOT applied separately: its single
#   hunk is already inside dt2w-full-fix.patch, so applying it again
#   would conflict with itself.
# EXPECTED AFTER FLASHING A v22 BUILD (test, in order):
#   1. uname -a timestamp must be newer than the v21 build (gate: the
#      flash actually took the new kernel, not the old boot.img).
#   2. cat /proc/touchpanel/double_tap_enable -> 0, WITHOUT any echo.
#      That is CORRECT for this version: Light does not change the
#      default. A reading of 1 here would mean the wrong patch ran.
#   3. Enable DT2W the original way: install the original Magisk module
#      (id dt2w-realme2, service.sh writes "on" to /proc/ilitek/gesture
#      after boot_completed + 5 s), OR manually: echo 1 >
#      /proc/touchpanel/double_tap_enable. Then lock, wait 10 s,
#      double-tap centre -> screen wakes (KEY_WAKEUP).
# NOTE: a ROM flash replaces boot.img and therefore this kernel - reflash
#   the proven v22 kernel after any ROM flash if DT2W is still wanted.
#   The Light patch file itself is EMBEDDED below as a heredoc (the
#   GitHub checkout does not have this workspace's patch file), and its
#   md5 is recorded in the step so the run log proves which patch ran.
#
# v20-pstore-base-only (2026-10-28): v19 with the broken project mode REMOVED.
# WHY: on-device proof 2026-10-28 (kernel 4.9.337-arcticfox-reei, v19 project run):
#   base node status = "disabled", project node resized exactly as v19 intended
#   (console 0x40000, record 0x20000, pmsg 0x20000), yet dmesg shows NO ramoops
#   line at all and /dev/pmsg0 does not exist. The driver never probed.
# ROOT CAUSE (drivers/of/platform.c in this tree):
#   of_platform_default_populate_init() creates a platform device for ONLY the
#   FIRST node with compatible = "ramoops" under /reserved-memory, found by
#   of_find_compatible_node(), which does NOT check status. The base node
#   (0x91400000) comes first in the DT, so disabling it makes
#   of_platform_device_create() return NULL and the project node is NEVER tried.
#   Disabling the base node therefore does not hand the slot to the project
#   node - it deletes the slot entirely. v17/v18/v19 project mode could never
#   work, regardless of sizes or config. This is proven, not a theory.
# FIX IN v20:
#   - pstore_region input REMOVED. There is no region choice anymore, so the
#     broken project mode cannot be selected by mistake (including by
#     re-running an old run, which reuses its original inputs).
#   - The base node (0x91400000, the vendor's original ramoops area) is FIXED
#     in place: single-cell sizes, record 0x20000, console 0x40000,
#     pmsg 0x20000, no ftrace, any status="disabled" removed. Dump area =
#     0x100000 - 0x40000 - 0 - 0x20000 = 0xA0000 = 5 records (fs/pstore/ram.c:
#     dump area = size - console - ftrace - pmsg; record size is NOT
#     subtracted).
#   - The project node (ramoops@92100000 in sdm450-pmi632.dtsi) is DELETED
#     outright (not disabled - disabling a ramoops node is exactly the bug
#     above). It is referenced nowhere else in the tree, so deleting it only
#     removes a second, never-probed ramoops area. The S88051AA1 node in the
#     unused mtp-s3 file is left alone (that file is included by no DTS).
#   - Fail-fast at THREE points, so a bad kernel can never again upload
#     silently: (1) defconfig after the pstore edit, (2) .config immediately
#     after `make defconfig` and BEFORE the parallel build, (3) built .config
#     after the build (kept from v19, strengthened). The pstore step also
#     prints the edited base node and the git diff, so the run log itself
#     proves what changed.
#   - pstore enabled/disabled choice KEPT (default enabled). Disabled means
#     no pstore at all by design, and the DT is left untouched in that case.
# EXPECTED AFTER FLASHING A v20 ENABLED BUILD:
#   dmesg | grep -i ramoops  ->  "ramoops: attached 0x100000@0x91400000"
#   and "Registered ramoops as persistent store backend"; /dev/pmsg0 exists;
#   after a warm `adb reboot`, /sys/fs/pstore contains console-ramoops.
#   NOTE: a ROM flash replaces boot.img and therefore this kernel - reflash
#   the proven v20 kernel after any ROM flash if pstore is still wanted.
#
# v18-fixdep-guard (2026-10-26): v17 + a host-tool guard in the Build step.
# DIAGNOSIS of the 2026-10-26 06:45 UTC run (commit e08a81f, pstore=enabled):
# the BakaSU hooks, low-RAM tweaks, ramoops DT fix, and pstore config
# steps ALL succeeded (DT diff stat shown, all four PSTORE lines =y).
# The first fatal error was later, in the Build step, before any DTB or
# kernel code compiled:
#   /bin/sh: 1: scripts/basic/fixdep: Permission denied
#   make[1]: *** [Kbuild:21: kernel/bounds.s] Error 126
#   make: *** [Makefile:1240: prepare0] Error 2
# so the ramoops DT fix is NOT the cause and was NOT tested by that run.
# The log alone does not prove whether fixdep lost its execute bit or
# parallel jobs raced to rebuild it (both parallel jobs failed on fixdep
# at the same second, 06:45:38). The guard below addresses both: it
# builds the host tools serially first, forces fixdep executable, and
# prints ls -l so the next log proves fixdep's mode at build start.
# If the next run still fails on fixdep, that ls -l line is the evidence
# that narrows it to a filesystem/runner issue rather than a race.
#
# v19-pstore-script (2026-10-26): v18 + corrected pstore/ramoops fix.
# The two old steps (DT fix + pstore toggle) are now ONE step that writes
# and runs the fix script inline (no extra file to commit).
# Corrections to the v17 notes:
#  - The old project node (console 0x80000, record 0x40000, ftrace 0x20000,
#    pmsg 0x20000) sums to exactly 0x100000, but the driver's dump area is
#    region - console - ftrace - pmsg (fs/pstore/ram.c; the record size is
#    NOT subtracted) = 0x40000 = one record. So that node is NOT proven to
#    fail. What is proven: the base node (msm8953.dtsi) has a two-cell
#    record-size, the driver reads 0, and it fails with "must be non-zero".
#  - The driver allows only ONE ramoops area; the first node that probes
#    successfully wins.
# New pstore_region input:
#   project (default): disable the base node, resize the project node
#                      (console 0x40000, record 0x20000, pmsg 0x20000).
#   base:              fix the base node instead and leave the project node
#                      alone. Use it if dmesg shows no "ramoops: attached".
# Test: build, flash, dmesg | grep -i ramoops. Not compiled or boot-tested.
#
# v16-pstore-toggle (2026-10-26): base is the GitHub ArcticFox workflow
# build-kernel-bakasu.yml as fetched 2026-10-26 (600 lines, body identical
# to the local v15 file except v15's version header, which the GitHub copy
# does not carry). NO other step changed.
#
# NEW: a workflow_dispatch select box for pstore (ramoops).
#   pstore = enabled  (default): PSTORE + PSTORE_RAM + PSTORE_CONSOLE +
#                          PSTORE_PMSG are forced on in the defconfig
#                          before the build, so the built kernel keeps a
#                          console log across a reboot (last-kmsg) and
#                          saves panic/oops dumps to RAM.
#   pstore = disabled: all four are forced off; no pstore code is built.
# Push-triggered runs have no dispatch input, so they fall back to
# "enabled" inside the step (see the -z check).
#
# WHAT "FIX" MEANS HERE: the defconfig already shipped PSTORE=y and
# PSTORE_RAM=y, but PSTORE_CONSOLE and PSTORE_PMSG were off, so no
# running console log was kept. This toggle turns those two on in the
# enabled case. Pstore covers kernel panic/oops/console only, not
# userspace HAL crashes (those go to tombstones).
#
# The defconfig ships PSTORE_FTRACE/PMSG/CONSOLE as non-standard
# "#CONFIG_...=n" comments, which scripts/config does not recognise as
# set/unset lines; the pstore step deletes those three comment lines
# first, so the toggle is the only CONSOLE/PMSG setting in the file.
# PSTORE_FTRACE stays off in both modes (overhead, not needed here).
#
# Build the RMX1805 (ArcticFox) kernel with BakaSU integrated,
# then pack it as a flashable AnyKernel3 zip.
#
# FULLY SELF-CONTAINED: this workflow applies the BakaSU manual-hook
# patch itself (see "Integrate BakaSU hooks" step), fetches the BakaSU
# driver via the official setup.sh, builds, and packs AnyKernel3.
# Just copy this file to .github/workflows/build-kernel.yml and push.

name: Build RMX1805 Kernel (BakaSU)

on:
  workflow_dispatch:
    inputs:
      pstore:
        description: 'Pstore (ramoops) logging'
        type: choice
        required: true
        default: 'enabled'
        options:
          - enabled
          - disabled
  push:
    branches:
      - ArcticFox
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Integrate BakaSU hooks
        run: |
          cat > /tmp/bakasu-hooks.patch <<'PATCHEOF'
          diff --git a/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig b/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig
          index a3dd48bb..d13bba72 100644
          --- a/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig
          +++ b/arch/arm64/configs/RMX1805_ArcticFox-KSU_defconfig
          @@ -750,6 +750,8 @@ CONFIG_SCHED_DEBUG=y
           CONFIG_EXT4_ASYNC_DISCARD_SUPPORT=y
           #endif
           
          -# KernelSU
          +# KernelSU (BakaSU, manual hook mode for 4.9 non-GKI)
           CONFIG_KSU=y
          +# CONFIG_KSU_TRACEPOINT_HOOK is not set
          +CONFIG_KSU_MANUAL_HOOK=y
           CONFIG_OVERLAY_FS=y
          diff --git a/drivers/input/input.c b/drivers/input/input.c
          index 6665c2a8..1e04d2e4 100644
          --- a/drivers/input/input.c
          +++ b/drivers/input/input.c
          @@ -377,20 +377,11 @@ static int input_get_disposition(struct input_dev *dev,
           	return disposition;
           }
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_input_hook __read_mostly;
          -extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          -#endif
          -
           static void input_handle_event(struct input_dev *dev,
           			       unsigned int type, unsigned int code, int value)
           {
           	int disposition = input_get_disposition(dev, type, code, &value);
           
          -	#ifdef CONFIG_KSU
          -	if (unlikely(ksu_input_hook))
          -		ksu_handle_input_handle_event(&type, &code, &value);
          -	#endif
           	if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
           		add_input_randomness(type, code, value);
           
          diff --git a/fs/exec.c b/fs/exec.c
          index 12fbb811..dbeafb6b 100644
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1815,12 +1815,13 @@ static int oppo_check_execveat_perm(struct file* filp)
            * sys_execve() executes a new program.
            */
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_execveat_hook __read_mostly;
          -extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          -			void *envp, int *flags);
          -extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          -				 void *argv, void *envp, int *flags);
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +__attribute__((hot))
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          +				void *argv, void *envp, int *flags);
          +__attribute__((hot))
          +extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,
          +				void *argv, void *envp, int *flags, int *retval);
           #endif
           
           static int do_execveat_common(int fd, struct filename *filename,
          @@ -1834,12 +1835,9 @@ static int do_execveat_common(int fd, struct filename *filename,
           	struct files_struct *displaced;
           	int retval;
           
          -	#ifdef CONFIG_KSU
          -	if (unlikely(ksu_execveat_hook))
          -		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          -	else
          -		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          -	#endif
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +#endif
           
           	if (IS_ERR(filename))
           		return PTR_ERR(filename);
          @@ -1982,6 +1980,9 @@ static int do_execveat_common(int fd, struct filename *filename,
           	putname(filename);
           	if (displaced)
           		put_files_struct(displaced);
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);
          +#endif
           	return retval;
           
           out:
          @@ -2003,6 +2004,9 @@ static int do_execveat_common(int fd, struct filename *filename,
           		reset_files_struct(displaced);
           out_ret:
           	putname(filename);
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);
          +#endif
           	return retval;
           }
           
          diff --git a/fs/open.c b/fs/open.c
          index 9a87e001..7eda1c1a 100644
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -355,7 +355,7 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           	return error;
           }
           
          -#ifdef CONFIG_KSU
          +#ifdef CONFIG_KSU_MANUAL_HOOK
           extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
           			 int *flags);
           #endif
          @@ -375,7 +375,7 @@ SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
           	int res;
           	unsigned int lookup_flags = LOOKUP_FOLLOW;
           
          -	#ifdef CONFIG_KSU
          +	#ifdef CONFIG_KSU_MANUAL_HOOK
           	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
           	#endif
           
          diff --git a/fs/read_write.c b/fs/read_write.c
          index 93a33c07..90123126 100644
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -456,21 +456,10 @@ ssize_t __vfs_read(struct file *file, char __user *buf, size_t count,
           }
           EXPORT_SYMBOL(__vfs_read);
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_vfs_read_hook __read_mostly;
          -extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          -			size_t *count_ptr, loff_t **pos);
          -#endif
          -
           ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
           {
           	ssize_t ret;
           
          -	#ifdef CONFIG_KSU
          -	if (unlikely(ksu_vfs_read_hook))
          -		ksu_handle_vfs_read(&file, &buf, &count, &pos);
          -	#endif
          -
           	if (!(file->f_mode & FMODE_READ))
           		return -EBADF;
           	if (!(file->f_mode & FMODE_CAN_READ))
          diff --git a/fs/stat.c b/fs/stat.c
          index ce24d2a1..2d9a81dd 100644
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -87,10 +87,6 @@ int vfs_fstat(unsigned int fd, struct kstat *stat)
           }
           EXPORT_SYMBOL(vfs_fstat);
           
          -#ifdef CONFIG_KSU
          -extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          -#endif
          -
           int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,
           		int flag)
           {
          @@ -98,10 +94,6 @@ int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,
           	int error = -EINVAL;
           	unsigned int lookup_flags = 0;
           
          -	#ifdef CONFIG_KSU
          -	ksu_handle_stat(&dfd, &filename, &flag);
          -	#endif
          -
           	if ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
           		      AT_EMPTY_PATH)) != 0)
           		goto out;
          @@ -295,6 +287,17 @@ SYSCALL_DEFINE2(newlstat, const char __user *, filename,
           	return cp_new_stat(&stat, statbuf);
           }
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +__attribute__((hot))
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
          +				int *flags);
          +
          +extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          +#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          +extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr); // optional
          +#endif
          +#endif
          +
           #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
           SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           		struct stat __user *, statbuf, int, flag)
          @@ -302,6 +305,9 @@ SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           	struct kstat stat;
           	int error;
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_stat(&dfd, &filename, &flag);
          +#endif
           	error = vfs_fstatat(dfd, filename, &stat, flag);
           	if (error)
           		return error;
          @@ -317,6 +323,9 @@ SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
           	if (!error)
           		error = cp_new_stat(&stat, statbuf);
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_newfstat_ret(&fd, &statbuf);
          +#endif
           	return error;
           }
           
          @@ -435,6 +444,9 @@ SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)
           	if (!error)
           		error = cp_new_stat64(&stat, statbuf);
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK // for 32-bit
          +	ksu_handle_fstat64_ret(&fd, &statbuf);
          +#endif
           	return error;
           }
           
          @@ -444,6 +456,9 @@ SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,
           	struct kstat stat;
           	int error;
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK // 32-bit su
          +	ksu_handle_stat(&dfd, &filename, &flag);
          +#endif
           	error = vfs_fstatat(dfd, filename, &stat, flag);
           	if (error)
           		return error;
          diff --git a/kernel/reboot.c b/kernel/reboot.c
          index 2946ed1d..ac2bcff5 100644
          --- a/kernel/reboot.c
          +++ b/kernel/reboot.c
          @@ -277,6 +277,11 @@ static DEFINE_MUTEX(reboot_mutex);
            *
            * reboot doesn't sync: do that yourself before calling this.
            */
          +
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          +#endif
          +
           SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           		void __user *, arg)
           {
          @@ -284,6 +289,9 @@ SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           	char buffer[256];
           	int ret = 0;
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          +#endif
           	/* We only trust the superuser with rebooting the system. */
           	if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))
